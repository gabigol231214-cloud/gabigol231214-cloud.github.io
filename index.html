  }

  // Avança a linha no registrador v (incremento vertical do scroll)
  incY() {
    let v = this.v;
    if ((v & 0x7000) !== 0x7000) { v += 0x1000; }
    else {
      v &= ~0x7000;
      let y = (v & 0x03E0) >> 5;
      if (y === 29) { y = 0; v ^= 0x0800; }
      else if (y === 31) y = 0;
      else y += 1;
      v = (v & ~0x03E0) | (y << 5);
    }
    this.v = v;
  }

  // ---------- Desenho de uma linha ----------
  drawLine(y) {
    const fb = this.framebuffer;
    const rendering = this.renderingOn();
    const showBg = (this.mask & 0x08) !== 0, showSpr = (this.mask & 0x10) !== 0;
    const bgLeft = (this.mask & 0x02) !== 0, sprLeft = (this.mask & 0x04) !== 0;
    const grey = (this.mask & 0x01) ? 0x30 : 0x3F;
    const bgIdx = new Uint8Array(256);       // índice da paleta do fundo, 0 = transparente
    const sprIdx = new Uint8Array(256);      // índice da paleta de sprites, 0 = transparente
    const sprBehind = new Uint8Array(256);
    const sprite0At = new Uint8Array(256);

    // ----- fundo -----
    const v = this.v;
    const coarseX = v & 0x1F, coarseY = (v >> 5) & 0x1F, ntBits = (v >> 10) & 3, fineY = (v >> 12) & 7;
    const patBase = (this.ctrl & 0x10) ? 0x1000 : 0;
    if (rendering && showBg) {
      for (let px = 0; px < 256; px++) {
        if (px < 8 && !bgLeft) continue;
        const totalX = coarseX * 8 + this.fineX + px;
        // o v já avança uma linha por linha (incY); não somar y aqui, senão a imagem anda 2x
        const totalY = coarseY * 8 + fineY;
        const ntX = ((ntBits & 1) + (totalX >> 8)) & 1;
        const ntY = (ntBits >> 1) + Math.floor(totalY / 240);
        const row = totalY % 240, col = totalX & 0xFF;
        const tileRow = row >> 3, tileCol = col >> 3;
        const nt = (ntY & 1) * 2 + ntX;
        const nameAddr = 0x2000 + nt * 0x400 + tileRow * 32 + tileCol;
        const tile = this.busRead(nameAddr);
        const attr = this.busRead(0x23C0 + nt * 0x400 + (tileRow >> 2) * 8 + (tileCol >> 2));
        const shift = ((tileRow & 2) ? 4 : 0) + ((tileCol & 2) ? 2 : 0);
        const pal = (attr >> shift) & 3;
        const fx = col & 7, fy = row & 7;
        const lo = this.cart.ppuRead(patBase + tile * 16 + fy);
        const hi = this.cart.ppuRead(patBase + tile * 16 + fy + 8);
        const bit = 7 - fx;
        const pix = ((lo >> bit) & 1) | (((hi >> bit) & 1) << 1);
        if (pix) bgIdx[px] = pal * 4 + pix;
      }
    }

    // ----- sprites -----
    const h = (this.ctrl & 0x20) ? 16 : 8;
    const list = [];
    for (let s = 0; s < 64 && list.length <= 8; s++) {
      const sy = this.oam[s * 4] + 1;
      if (y >= sy && y < sy + h) list.push(s);
    }
    if (list.length > 8) { this.status |= 0x20; list.length = 8; }
    if (rendering && showSpr) {
      for (const s of list) {
        const sy = this.oam[s * 4] + 1;
        const tileByte = this.oam[s * 4 + 1];
        const attr = this.oam[s * 4 + 2];
        const sx = this.oam[s * 4 + 3];
        const flipH = (attr & 0x40) !== 0, flipV = (attr & 0x80) !== 0;
        let row = y - sy;
        if (flipV) row = h - 1 - row;
        let tileNum, base;
        if (h === 16) {
          base = (tileByte & 1) ? 0x1000 : 0;
          tileNum = tileByte & 0xFE;
          if (row >= 8) { tileNum++; row -= 8; }
        } else {
          base = (this.ctrl & 0x08) ? 0x1000 : 0;
          tileNum = tileByte;
        }
        const lo = this.cart.ppuRead(base + tileNum * 16 + row);
        const hi = this.cart.ppuRead(base + tileNum * 16 + row + 8);
        for (let p = 0; p < 8; p++) {
          const x = sx + p;
          if (x > 255) break;
          if (x < 8 && !sprLeft) continue;
          const bit = flipH ? p : 7 - p;
          const pix = ((lo >> bit) & 1) | (((hi >> bit) & 1) << 1);
          if (!pix || sprIdx[x]) continue;          // pixel transparente ou sprite de cima já desenhado
          sprIdx[x] = 16 + (attr & 3) * 4 + pix;
          sprBehind[x] = (attr & 0x20) ? 1 : 0;
          if (s === 0) sprite0At[x] = 1;
        }
      }
    }

    // ----- combina fundo e sprites, e checa o sprite 0 -----
    for (let px = 0; px < 256; px++) {
      let idx = bgIdx[px] ? this.palette[bgIdx[px]] : this.palette[0];
      const bgOpaque = bgIdx[px] !== 0;
      const spr = sprIdx[px];
      if (spr) {
        if (sprite0At[px] && bgOpaque && px < 255 && rendering) this.status |= 0x40;
        if (!(sprBehind[px] && bgOpaque)) idx = this.palette[spr & 0x1F];
      }
      const c = NES_RGB[idx & 0x3F & grey] || NES_RGB[0];
      const o = (y * 256 + px) * 4;
      fb[o] = c[0]; fb[o + 1] = c[1]; fb[o + 2] = c[2]; fb[o + 3] = 255;
    }
  }
}

<script>
// ============ APU do NES (som) ============
// Canais: 2 pulsos (com varredura), triângulo, ruído e DMC (samples), mais o sequenciador de quadro.
// Mixagem pelas fórmulas não lineares do aparelho. As amostras são geradas no clock da CPU (1,789773 MHz)
// e reduzidas para a taxa do navegador por média. O DMC lê a memória sem gastar ciclos da CPU (aproximação).

const NES_CPU_HZ = 1789773;
const NES_LENGTH = [10,254,20,2,40,4,80,6,160,8,60,10,14,12,26,14,12,16,24,18,48,20,96,22,192,24,72,26,16,28,32,30];

const NES_PULSE_MIX = Array.from({ length: 31 }, (_, n) => n === 0 ? 0 : 95.52 / (8128 / n + 100));
const NES_TND_MIX = Array.from({ length: 203 }, (_, n) => n === 0 ? 0 : 163.67 / (24329 / n + 100));

class NesEnvelope {
  constructor() { this.start = false; this.div = 0; this.decay = 0; this.loop = false; this.constant = false; this.vol = 0; }
  clock() {
    if (this.start) {
      this.start = false; this.decay = 15; this.div = this.vol;
    } else if (this.div > 0) {
      this.div--;
    } else {
      this.div = this.vol;
      if (this.decay > 0) this.decay--;
      else if (this.loop) this.decay = 15;
    }
  }
  output() { return this.constant ? this.vol : this.decay; }
}

  constructor(ones) {

  pull() {
    if (this.rcount === 0) return 0;

    this.rr = (this.rr + 1) % this.ring.length;
    this.rcount--;
    return v * 0.9;

<script>
// ============ CPU Motorola 68000 (Sega Mega Drive) ============
// Processador de 16/32 bits, big-endian. Implementa o conjunto de instruções usado pelos jogos.
// Ciclos: aproximação (4 por instrução + 4 por acesso à memória).
// Limitações: BCD (ABCD/SBCD/NBCD) e MOVEP parcial; erro de endereço só gera exceção.

const M68_MASK = [0xFF, 0xFFFF, 0xFFFFFFFF];
const M68_MSB = [0x80, 0x8000, 0x80000000];
const M68_BITS = [8, 16, 32];
const C_FLAG = 1, V_FLAG = 2, Z_FLAG = 4, N_FLAG = 8, X_FLAG = 16, S_FLAG = 0x2000;

class M68Exc {

  reset() {
    this.sr = 0x2700;

    this.a[7] = this.ssp;

  rd8(a) { this.acc++; return this.bus.read8(a & 0xFFFFFF) & 0xFF; }

  wr16(a, v) {

    if ((op & 0xF100) === 0x0100) return this.bitOp(op, true);            // bit com registro
    if ((op & 0xFF00) === 0x0800) return this.bitOp(op, false);           // bit imediato

    if (op === 0x0A7C) { this.requireSupervisor(); this.setSR(this.sr ^ this.fetch16()); return; }
    if (sc === 3 || kind === 4) throw new M68Exc(4);
    const mode = (op >> 3) & 7, reg = op & 7;
    const imm = sc === 2 ? this.fetch32() : (this.fetch16() & M68_MASK[sc]);
    const e = this.ea(mode, reg, sc);

    if (kind === 0) { this.writeEA(e, sc, this.logic(dst | imm, sc)); return; }   // ORI
    if (kind === 1) { this.writeEA(e, sc, this.logic(dst & imm, sc)); return; }   // ANDI
    if (kind === 2) { this.writeEA(e, sc, this.sub(dst, imm, sc, false)); return; } // SUBI
    if (kind === 3) { this.writeEA(e, sc, this.add(dst, imm, sc, false)); return; } // ADDI
    if (kind === 5) { this.writeEA(e, sc, this.logic(dst ^ imm, sc)); return; }   // EORI
    if (kind === 6) { this.cmp(dst, imm, sc); return; }                            // CMPI
    throw new M68Exc(4);
  }
  getCCRImm() { return this.fetch16() & 0x1F; }

  bitOp(op, dynamic) {
    const type = (op >> 6) & 3;      // 0 BTST, 1 BCHG, 2 BCLR, 3 BSET
    let bitn;
    if (dynamic) bitn = this.d[(op >> 9) & 7];

      const b = bitn & 31;

      this.setFlag(Z_FLAG, ((v >>> b) & 1) === 0);
      if (type === 1) this.d[reg] = (v ^ (1 << b)) >>> 0;
      else if (type === 2) this.d[reg] = (v & ~(1 << b)) >>> 0;

    const e = this.ea(mode, reg, 0);
    const b = bitn & 7;
    const v = this.readEA(e, 0);
    this.setFlag(Z_FLAG, ((v >>> b) & 1) === 0);
    if (type === 0) return;
    let nv = v;
    if (type === 1) nv = v ^ (1 << b);
    else if (type === 2) nv = v & ~(1 << b);
    else nv = v | (1 << b);
    this.writeEA(e, 0, nv & 0xFF);
  }

  movep(op) {
    const dataReg = (op >> 9) & 7, addrReg = op & 7;
    const toMem = (op & 0x80) !== 0, long = (op & 0x40) !== 0;
    const addr = (this.a[addrReg] + sext16(this.fetch16())) >>> 0;
    const n = long ? 4 : 2;
    if (toMem) {
      for (let i = 0; i < n; i++) {
        const sh = (n - 1 - i) * 8;
        this.wr8(addr + i * 2, (this.d[dataReg] >>> sh) & 0xFF);
      }
    } else {
      let v = 0;
      for (let i = 0; i < n; i++) v = ((v << 8) | this.rd8(addr + i * 2)) >>> 0;
      if (long) this.d[dataReg] = v >>> 0;
      else this.d[dataReg] = ((this.d[dataReg] & 0xFFFF0000) | v) >>> 0;
    }
  }

  group4(op) {
    // Instruções fixas
    switch (op) {
      case 0x4E71: return;                                                  // NOP
      case 0x4E75: this.pc = this.rd32(this.a[7]); this.a[7] = (this.a[7] + 4) >>> 0; return; // RTS
      case 0x4E73: {                                                        // RTE
        this.requireSupervisor();
        const sr = this.rd16(this.a[7]); this.a[7] = (this.a[7] + 2) >>> 0;
        const pc = this.rd32(this.a[7]); this.a[7] = (this.a[7] + 4) >>> 0;
        this.setSR(sr); this.pc = pc; return;
      }
      case 0x4E77: {                                                        // RTR
        const ccr = this.rd16(this.a[7]); this.a[7] = (this.a[7] + 2) >>> 0;
        this.setCCR(ccr);
        this.pc = this.rd32(this.a[7]); this.a[7] = (this.a[7] + 4) >>> 0; return;
      }
      case 0x4E70: this.requireSupervisor(); return;                         // RESET (sem efeito nos periféricos)
      case 0x4E72: { this.requireSupervisor(); this.setSR(this.fetch16()); this.stopped = true; return; } // STOP
      case 0x4AFC: throw new M68Exc(4);                                     // ILLEGAL
    }
    if ((op & 0xFFF0) === 0x4E40) {                                          // TRAP
      throw new M68Exc(32 + (op & 0xF));
    }
    if ((op & 0xFFF8) === 0x4E50) {                                          // LINK
      const r = op & 7;
      const disp = sext16(this.fetch16());
      this.a[7] = (this.a[7] - 4) >>> 0; this.wr32(this.a[7], this.a[r]);
      this.a[r] = this.a[7];
      this.a[7] = (this.a[7] + disp) >>> 0;
      return;
    }
    if ((op & 0xFFF8) === 0x4E58) {                                          // UNLK
      const r = op & 7;
      this.a[7] = this.a[r];
      this.a[r] = this.rd32(this.a[7]); this.a[7] = (this.a[7] + 4) >>> 0;
      return;
    }
    if ((op & 0xFFF0) === 0x4E60) {                                          // MOVE USP
      this.requireSupervisor();
      const r = op & 7;
      if (op & 8) this.a[r] = this.usp; else this.usp = this.a[r];
      return;
    }
    if ((op & 0xFFC0) === 0x40C0) {                                          // MOVE SR, <ea>
      const e = this.ea((op >> 3) & 7, op & 7, 1);
      this.writeEA(e, 1, this.sr);
      return;
    }
    if ((op & 0xFFC0) === 0x44C0) {                                          // MOVE <ea>, CCR
      const e = this.ea((op >> 3) & 7, op & 7, 1);
      this.setCCR(this.readEA(e, 1));
      return;
    }
    if ((op & 0xFFC0) === 0x46C0) {                                          // MOVE <ea>, SR
      this.requireSupervisor();
      const e = this.ea((op >> 3) & 7, op & 7, 1);
      this.setSR(this.readEA(e, 1));
      return;
    }
    if ((op & 0xFFC0) === 0x4800 || (op & 0xFFC0) === 0x4840) {
      // NBCD (0x4800) não implementado; SWAP/PEA tratados abaixo
    }
    if ((op & 0xFFF8) === 0x4840) {                                          // SWAP
      const r = op & 7;
      const v = this.d[r];
      this.d[r] = (((v & 0xFFFF) << 16) | (v >>> 16)) >>> 0;
      this.setNZ(this.d[r], 2);
      this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      return;
    }
    if ((op & 0xFFC0) === 0x4840) {                                          // PEA
      const e = this.ea((op >> 3) & 7, op & 7, 2);
      this.a[7] = (this.a[7] - 4) >>> 0; this.wr32(this.a[7], e.a);
      return;
    }
    if ((op & 0xFFF8) === 0x4880 || (op & 0xFFF8) === 0x48C0) {              // EXT
      const r = op & 7;
      if (op & 0x40) this.d[r] = sext16(this.d[r] & 0xFFFF) >>> 0;
      else this.d[r] = (this.d[r] & 0xFFFF0000) | (sext8(this.d[r] & 0xFF) & 0xFFFF);
      const sc = (op & 0x40) ? 2 : 1;
      this.setNZ(this.d[r], sc);
      this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      return;
    }
    if ((op & 0xFB80) === 0x4880) return this.movem(op);                    // MOVEM
    if ((op & 0xFFC0) === 0x4AC0) {                                          // TAS
      const e = this.ea((op >> 3) & 7, op & 7, 0);
      const v = this.readEA(e, 0);
      this.setNZ(v, 0); this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      this.writeEA(e, 0, v | 0x80);
      return;
    }
    if ((op & 0xF1C0) === 0x41C0) {                                          // LEA
      const e = this.ea((op >> 3) & 7, op & 7, 2);
      this.a[(op >> 9) & 7] = e.a >>> 0;
      return;
    }
    if ((op & 0xF1C0) === 0x4180) {                                          // CHK
      const e = this.ea((op >> 3) & 7, op & 7, 1);
      const bound = sext16(this.readEA(e, 1));
      const reg = sext16(this.d[(op >> 9) & 7] & 0xFFFF);
      this.setFlag(N_FLAG, reg < 0); this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      if (reg < 0 || reg > bound) { this.setFlag(N_FLAG, reg < 0); throw new M68Exc(6); }
      return;
    }
    if ((op & 0xFFC0) === 0x4E80) {                                          // JSR
      const e = this.ea((op >> 3) & 7, op & 7, 2);
      this.a[7] = (this.a[7] - 4) >>> 0; this.wr32(this.a[7], this.pc);
      this.pc = e.a >>> 0;
      return;
    }
    if ((op & 0xFFC0) === 0x4EC0) {                                          // JMP
      const e = this.ea((op >> 3) & 7, op & 7, 2);
      this.pc = e.a >>> 0;
      return;
    }
    if ((op & 0xFFF0) === 0x4E40) return;
    if ((op & 0xF1C0) === 0x50C0) return;
    // CLR (0x4200), NEG (0x4400), NOT (0x4600), NEGX (0x4000), TST (0x4A00)
    const sc = (op >> 6) & 3;
    const kind = (op >> 8) & 0xF;
    if (sc === 3) throw new M68Exc(4);
    const e = this.ea((op >> 3) & 7, op & 7, sc);
    switch (kind) {
      case 0x0: { // NEGX
        const v = this.readEA(e, sc);
        const r = this.sub(0, v, sc, true);
        this.writeEA(e, sc, r);
        return;
      }
      case 0x2: { // CLR
        this.readEA(e, sc);
        this.writeEA(e, sc, 0);
        this.setFlag(N_FLAG, false); this.setFlag(Z_FLAG, true);
        this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
        return;
      }
      case 0x4: { // NEG
        const v = this.readEA(e, sc);
        const r = this.sub(0, v, sc, false);
        this.writeEA(e, sc, r);
        return;
      }
      case 0x6: { // NOT
        const v = this.readEA(e, sc);
        this.writeEA(e, sc, this.logic(~v, sc));
        return;
      }
      case 0xA: { // TST
        this.logic(this.readEA(e, sc), sc);
        return;
      }
    }
    throw new M68Exc(4);
  }

  // MOVEM: salva ou carrega vários registradores
  movem(op) {
    const sc = (op & 0x40) ? 2 : 1;
    const toReg = (op & 0x400) !== 0;
    const mask = this.fetch16();
    const mode = (op >> 3) & 7, reg = op & 7;
    const step = sc === 2 ? 4 : 2;
    if (!toReg && mode === 4) {
      // Predecremento: bit 0 = A7 ... bit 15 = D0; grava de A7 para D0
      let addr = this.a[reg];
      for (let k = 0; k < 16; k++) {
        if (!((mask >> k) & 1)) continue;
        const r16 = 15 - k;
        addr = (addr - step) >>> 0;
        const v = r16 < 8 ? this.d[r16] : this.a[r16 - 8];
        if (sc === 2) this.wr32(addr, v); else this.wr16(addr, v & 0xFFFF);
      }
      this.a[reg] = addr;
      return;
    }
    let addr;
    if (mode === 3) addr = this.a[reg];
    else addr = this.ea(mode, reg, sc).a;
    for (let r16 = 0; r16 < 16; r16++) {
      if (!((mask >> r16) & 1)) continue;
      if (toReg) {
        const v = sc === 2 ? this.rd32(addr) : sext16(this.rd16(addr)) >>> 0;
        if (r16 < 8) this.d[r16] = v; else this.a[r16 - 8] = v;
      } else {
        const v = r16 < 8 ? this.d[r16] : this.a[r16 - 8];
        if (sc === 2) this.wr32(addr, v); else this.wr16(addr, v & 0xFFFF);
      }
      addr = (addr + step) >>> 0;
    }
    if (mode === 3) this.a[reg] = addr;
  }

  group5(op) {
    if ((op & 0xC0) === 0xC0) {
      if ((op & 0xF8) === 0xC8) return this.dbcc(op);                      // DBcc
      // Scc
      const e = this.ea((op >> 3) & 7, op & 7, 0);
      this.writeEA(e, 0, this.cond((op >> 8) & 0xF) ? 0xFF : 0);
      return;
    }
    // ADDQ / SUBQ
    let data = (op >> 9) & 7; if (data === 0) data = 8;
    const sc = (op >> 6) & 3;
    const mode = (op >> 3) & 7, reg = op & 7;
    if (mode === 1) {
      // An: operação inteira, sem flags, palavra vira 32 bits
      if (op & 0x100) this.a[reg] = (this.a[reg] - data) >>> 0;
      else this.a[reg] = (this.a[reg] + data) >>> 0;
      return;
    }
    const e = this.ea(mode, reg, sc);
    const dst = this.readEA(e, sc);
    if (op & 0x100) this.writeEA(e, sc, this.sub(dst, data, sc, false));
    else this.writeEA(e, sc, this.add(dst, data, sc, false));
  }

  dbcc(op) {
    const disp = sext16(this.fetch16());
    const base = (this.pc - 2) >>> 0;
    const reg = op & 7;
    if (this.cond((op >> 8) & 0xF)) return;
    const cnt = ((this.d[reg] & 0xFFFF) - 1) & 0xFFFF;
    this.d[reg] = ((this.d[reg] & 0xFFFF0000) | cnt) >>> 0;
    if (cnt !== 0xFFFF) this.pc = (base + disp) >>> 0;
  }

  group6(op) {
    const c = (op >> 8) & 0xF;
    const base = this.pc;
    let disp = sext8(op & 0xFF);
    if ((op & 0xFF) === 0) disp = sext16(this.fetch16());
    else if ((op & 0xFF) === 0xFF) throw new M68Exc(4);     // formato de 68020, não existe aqui
    if (c === 1) {                                           // BSR
      const ret = this.pc;
      this.a[7] = (this.a[7] - 4) >>> 0; this.wr32(this.a[7], ret);
      this.pc = (base + disp) >>> 0;
      return;
    }
    if (c === 0 || this.cond(c)) this.pc = (base + disp) >>> 0;   // BRA e Bcc
  }

  group8(op) {
    const reg = (op >> 9) & 7;
    const sc = (op >> 6) & 3;
    if (sc === 3) {
      // DIVU (0x80C0) e DIVS (0x81C0)
      const signed = (op & 0x100) !== 0;
      const e = this.ea((op >> 3) & 7, op & 7, 1);
      const divisor = this.readEA(e, 1);
      if (divisor === 0) throw new M68Exc(5);
      if (!signed) {
        const dividend = this.d[reg] >>> 0;
        const q = Math.floor(dividend / divisor);
        const r = dividend % divisor;
        if (q > 0xFFFF) { this.setFlag(V_FLAG, true); this.setFlag(C_FLAG, false); return; }
        this.d[reg] = ((r << 16) | q) >>> 0;
        this.setFlag(N_FLAG, (q & 0x8000) !== 0); this.setFlag(Z_FLAG, q === 0);
        this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
        return;
      }
      const dividend = this.d[reg] | 0;
      const dv = sext16(divisor);
      const q = Math.trunc(dividend / dv);
      const r = dividend - q * dv;
      if (q > 32767 || q < -32768) { this.setFlag(V_FLAG, true); this.setFlag(C_FLAG, false); return; }
      this.d[reg] = (((r & 0xFFFF) << 16) | (q & 0xFFFF)) >>> 0;
      this.setFlag(N_FLAG, q < 0); this.setFlag(Z_FLAG, q === 0);
      this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      return;
    }
    if ((op & 0x1F0) === 0x100) throw new M68Exc(4);           // SBCD (não implementado)
    const e = this.ea((op >> 3) & 7, op & 7, sc);
    const src = this.readEA(e, sc);
    if (op & 0x100) {
      const dst = this.rdSz(e.a, sc);
      this.wrSz(e.a, sc, this.logic(dst | this.d[reg], sc));
      return;
    }
    const r = this.logic(this.d[reg] | src, sc);
    this.writeEA({ t: 0, n: reg }, sc, r);
  }

  // SUB (9), SUBA, SUBX, ADD (D), ADDA, ADDX
  group9d(op, isAdd) {
    const reg = (op >> 9) & 7;
    const opmode = (op >> 6) & 7;
    const mode = (op >> 3) & 7, r = op & 7;
    if (opmode === 3 || opmode === 7) {
      // ADDA/SUBA: destino An, sempre 32 bits
      const sc = opmode === 3 ? 1 : 2;
      const e = this.ea(mode, r, sc);
      const src = sc === 1 ? sext16(this.readEA(e, 1)) >>> 0 : this.readEA(e, 2);
      this.a[reg] = isAdd ? ((this.a[reg] + src) >>> 0) : ((this.a[reg] - src) >>> 0);
      return;
    }
    const sc = opmode & 3;
    if ((op & 0x130) === 0x100) {
      // SUBX / ADDX
      const rm = (op & 8) !== 0;
      if (rm) {
        this.a[r] = (this.a[r] - (M68_BITS[sc] / 8)) >>> 0;
        this.a[reg] = (this.a[reg] - (M68_BITS[sc] / 8)) >>> 0;
        const src = this.rdSz(this.a[r], sc);
        const dst = this.rdSz(this.a[reg], sc);
        const res = isAdd ? this.add(dst, src, sc, true) : this.sub(dst, src, sc, true);
        this.wrSz(this.a[reg], sc, res);
      } else {
        const src = this.readEA({ t: 0, n: r }, sc);
        const dst = this.readEA({ t: 0, n: reg }, sc);
        const res = isAdd ? this.add(dst, src, sc, true) : this.sub(dst, src, sc, true);
        this.writeEA({ t: 0, n: reg }, sc, res);
      }
      return;
    }
    const e = this.ea(mode, r, sc);
    const memSrc = this.readEA(e, sc);
    if (opmode < 4) {
      // <ea> op Dn -> Dn
      const dst = this.readEA({ t: 0, n: reg }, sc);
      const res = isAdd ? this.add(dst, memSrc, sc, false) : this.sub(dst, memSrc, sc, false);
      this.writeEA({ t: 0, n: reg }, sc, res);
    } else {
      // Dn op <ea> -> <ea>
      const dst = this.readEA(e, sc);
      const srcD = this.d[reg] & M68_MASK[sc];
      const res = isAdd ? this.add(dst, srcD, sc, false) : this.sub(dst, srcD, sc, false);
      this.writeEA(e, sc, res);
    }
  }

  groupB(op) {
    const reg = (op >> 9) & 7;
    const opmode = (op >> 6) & 7;
    const mode = (op >> 3) & 7, r = op & 7;
    if (opmode === 3 || opmode === 7) {
      const sc = opmode === 3 ? 1 : 2;
      const e = this.ea(mode, r, sc);
      const src = sc === 1 ? sext16(this.readEA(e, 1)) >>> 0 : this.readEA(e, 2);
      this.cmp(this.a[reg] >>> 0, src >>> 0, 2);
      return;
    }
    const sc = opmode & 3;
    if (opmode >= 4 && mode === 1) {
      // CMPM (Ay)+, (Ax)+
      const src = this.rdSz(this.a[r], sc);
      this.a[r] = (this.a[r] + (sc === 0 && r === 7 ? 2 : M68_BITS[sc] / 8)) >>> 0;
      const dst = this.rdSz(this.a[reg], sc);
      this.a[reg] = (this.a[reg] + (sc === 0 && reg === 7 ? 2 : M68_BITS[sc] / 8)) >>> 0;
      this.cmp(dst, src, sc);
      return;
    }
    const e = this.ea(mode, r, sc);
    if (opmode < 4) {
      const src = this.readEA(e, sc);
      this.cmp(this.d[reg] & M68_MASK[sc], src, sc);
      return;
    }
    // EOR Dn, <ea>
    const dst = this.readEA(e, sc);
    this.writeEA(e, sc, this.logic(dst ^ (this.d[reg] & M68_MASK[sc]), sc));
  }

  groupC(op) {
    const reg = (op >> 9) & 7;
    const mode = (op >> 3) & 7, r = op & 7;
    if ((op & 0xF1F8) === 0xC140) {                                  // EXG Dn,Dn
      const t = this.d[reg]; this.d[reg] = this.d[r]; this.d[r] = t; return;
    }
    if ((op & 0xF1F8) === 0xC148) {                                  // EXG An,An
      const t = this.a[reg]; this.a[reg] = this.a[r]; this.a[r] = t; return;
    }
    if ((op & 0xF1F8) === 0xC188) {                                  // EXG Dn,An
      const t = this.d[reg]; this.d[reg] = this.a[r]; this.a[r] = t; return;
    }
    const opmode = (op >> 6) & 7;
    if (opmode === 3) {                                               // MULU
      const e = this.ea(mode, r, 1);
      const src = this.readEA(e, 1);
      const v = ((this.d[reg] & 0xFFFF) * src) >>> 0;
      this.d[reg] = v;
      this.setNZ(v, 2); this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      return;
    }
    if (opmode === 7) {                                               // MULS
      const e = this.ea(mode, r, 1);
      const src = sext16(this.readEA(e, 1));
      const v = (sext16(this.d[reg] & 0xFFFF) * src) >>> 0;
      this.d[reg] = v;
      this.setNZ(v, 2); this.setFlag(V_FLAG, false); this.setFlag(C_FLAG, false);
      return;
    }
    const sc = opmode & 3;
    if ((op & 0x130) === 0x100) throw new M68Exc(4);                // ABCD (não implementado)
    const e = this.ea(mode, r, sc);
    const src = this.readEA(e, sc);
    if (opmode < 4) {
      const res = this.logic(this.d[reg] & src, sc);
      this.writeEA({ t: 0, n: reg }, sc, res);
    } else {
      const dst = this.readEA(e, sc);
      this.writeEA(e, sc, this.logic(dst & (this.d[reg] & M68_MASK[sc]), sc));
    }
  }

  groupE(op) {
    const sc = (op >> 6) & 3;
    const kind = (op >> 3) & 3;
    const left = (op & 0x100) !== 0;
    if (sc === 3) {
      // Deslocamento de memória, sempre de 1 bit, palavra
      const e = this.ea((op >> 3) & 7, op & 7, 1);
      const v = this.readEA(e, 1);
      this.writeEA(e, 1, this.shift((op >> 9) & 3, left, v, 1, 1));
      return;
    }
    const reg = op & 7;
    const count = (op & 0x20) ? (this.d[(op >> 9) & 7] & 63) : (((op >> 9) & 7) || 8);
    const v = this.d[reg] & M68_MASK[sc];
    const res = this.shift(kind, left, v, count, sc);
    this.writeEA({ t: 0, n: reg }, sc, res);
  }
}

<script>
// ============ CPU Z80 (som do Mega Drive, e Master System no futuro) ============
// Conjunto completo de instruções documentadas (incluindo prefixos CB, DD, ED e FD).
// Ciclos: aproximação (4 por instrução + 3 por acesso à memória).
// Portas de I/O: se o barramento tiver in(porta)/out(porta, valor) eles são usados; senão IN devolve $FF e OUT é ignorado.

const Z_S = 0x80, Z_Z = 0x40, Z_Y = 0x20, Z_H = 0x10, Z_X = 0x08, Z_P = 0x04, Z_N = 0x02, Z_C = 0x01;
const Z_PAR = (() => {
  const t = new Uint8Array(256);
  for (let i = 0; i < 256; i++) {
    let p = 0, v = i;
    while (v) { p ^= v & 1; v >>= 1; }
    t[i] = p ? 0 : Z_P;
  }
  return t;
})();

class Z80 {
  // bus: { read(addr), write(addr, v) }
  constructor(bus) {
    this.bus = bus;
    this.g = new Uint8Array(8);       // B C D E H L (vazio) A, índices 0..7 (6 não é usado)
    this.F = 0;
    this.Ap = 0; this.Fp = 0;         // registradores alternativos A' e F'
    this.gs = new Uint8Array(6);      // B' C' D' E' H' L'
    this.IX = 0; this.IY = 0;
    this.SP = 0; this.PC = 0;
    this.I = 0; this.R = 0;
    this.IFF1 = false; this.IFF2 = false; this.IM = 0;
    this.halted = false;
    this.intLine = false;             // pedido de interrupção (INT)
    this.acc = 0;                     // acessos à memória nesta instrução
    this.prefix = 0;                  // 0, 0xDD (IX) ou 0xFD (IY)
    this.ixy = 0;                     // registrador de índice usado pelo prefixo
  }

  reset() {
    this.PC = 0; this.I = 0; this.R = 0; this.IFF1 = false; this.IFF2 = false; this.IM = 0;
    this.halted = false; this.F = 0; this.SP = 0; this.intLine = false;
  }

  // ---------- Memória ----------
  rd(a) { this.acc++; return this.bus.read(a & 0xFFFF) & 0xFF; }
  wr(a, v) { this.acc++; this.bus.write(a & 0xFFFF, v & 0xFF); }
  rd16(a) { return this.rd(a) | (this.rd(a + 1) << 8); }
  wr16(a, v) { this.wr(a, v & 0xFF); this.wr(a + 1, (v >> 8) & 0xFF); }
  fetch() {
    const v = this.rd(this.PC);
    this.PC = (this.PC + 1) & 0xFFFF;
    this.R = (this.R & 0x80) | ((this.R + 1) & 0x7F);
    return v;
  }
  fetch16() { const lo = this.fetch(); return lo | (this.fetch() << 8); }
  push(v) { this.SP = (this.SP - 2) & 0xFFFF; this.wr16(this.SP, v); }
  pop() { const v = this.rd16(this.SP); this.SP = (this.SP + 2) & 0xFFFF; return v; }

  get BC() { return (this.g[0] << 8) | this.g[1]; }

    if ((op & 0xCF) === 0x01) { this.setRp(p, this.fetch16()); return; }   // LD rr,nn (00 rr 0001)
    if ((op & 0xCF) === 0x03) { this.setRp(p, (this.rp(p) + 1) & 0xFFFF); return; }
    if ((op & 0xCF) === 0x0B) { this.setRp(p, (this.rp(p) - 1) & 0xFFFF); return; }
    if ((op & 0xCF) === 0x09) { this.HLX = this.add16(this.HLX, this.rp(p)); return; }
    // INC r / DEC r / LD r,n
    if ((op & 0xC7) === 0x04 || (op & 0xC7) === 0x05) {
      const dec = (op & 1) === 1;
      if (y === 6) {
        const a = this.memAddr(this.dispFor(6));
        const v = this.rd(a);
        this.wr(a, dec ? this.dec8(v) : this.inc8(v));
      } else {
        const v = this.getR(y);
        this.setR(y, dec ? this.dec8(v) : this.inc8(v));
      }
      return;
    }
    if ((op & 0xC7) === 0x06) {
      if (y === 6) {
        const a = this.memAddr(this.dispFor(6));
        const d = this.fetch();
        this.wr(a, d);
      } else {
        this.setR(y, this.fetch());
      }
      return;
    }
    // Condicionais: RET cc, POP/PUSH, JP cc, CALL cc, ALU n, RST
    if ((op & 0xC7) === 0xC0) { if (this.cond(y)) this.PC = this.pop(); return; }
    if ((op & 0xCF) === 0xC1) { const v = this.pop(); this.setPush(p, v); return; }
    if ((op & 0xCF) === 0xC5) { this.push(this.getPush(p)); return; }
    if ((op & 0xC7) === 0xC2) { const a = this.fetch16(); if (this.cond(y)) this.PC = a; return; }
    if ((op & 0xC7) === 0xC4) { const a = this.fetch16(); if (this.cond(y)) { this.push(this.PC); this.PC = a; } return; }
    if ((op & 0xC7) === 0xC6) { this.alu(y, this.fetch()); return; }
    if ((op & 0xC7) === 0xC7) { this.push(this.PC); this.PC = op & 0x38; return; }
    // Não documentados que não usamos: tratados como NOP
  }
  // Com prefixo IX/IY, o deslocamento d de (IX+d) vem logo depois do opcode
  dispFetch() { return this.prefix ? (this.fetch() << 24) >> 24 : 0; }
  dispFor(z) { return z === 6 ? this.dispFetch() : 0; }
  getPush(p) { return p === 0 ? this.BC : p === 1 ? this.DE : p === 2 ? this.HLX : this.AF; }
  setPush(p, v) {
    if (p === 0) this.BC = v; else if (p === 1) this.DE = v;
    else if (p === 2) this.HLX = v; else this.AF = v;
  }
  daa() {
    let A = this.g[7];
    const N = this.F & Z_N, C = this.F & Z_C, H = this.F & Z_H;
    let diff = 0, c = 0;
    if (H || (A & 0xF) > 9) diff |= 0x06;
    if (C || A > 0x99) { diff |= 0x60; c = Z_C; }
    const r = N ? (A - diff) & 0xFF : (A + diff) & 0xFF;
    const h = N ? (H && (A & 0xF) < 6 ? Z_H : 0) : (((A & 0xF) > 9) ? Z_H : 0);
    A = r;
    this.g[7] = A;
    this.F = (A & Z_S) | (A ? 0 : Z_Z) | (A & (Z_Y | Z_X)) | h | Z_PAR[A] | (N ? Z_N : 0) | c;
  }
}

<script>
// ============ PSG SN76489 (som do Mega Drive) ============
// 3 canais de tom (onda quadrada) e 1 de ruído, com volume em passos de 2 dB.
// Roda no relógio do Z80 dividido por 16 (um "tick" por 16 ciclos).
const PSG_VOL = Array.from({ length: 16 }, (_, i) => (i === 15 ? 0 : Math.pow(10, -(2 * i) / 20)));

class PSG {
  constructor() {
    this.tone = [1, 1, 1];        // período de cada tom (10 bits)
    this.toneCnt = [1, 1, 1];
    this.toneOut = [1, 1, 1];     // 1 = nível alto
    this.vol = [15, 15, 15, 15];  // 15 = silêncio
    this.noiseRate = 0;
    this.noiseWhite = false;
    this.lfsr = 0x8000;
    this.noiseCnt = 16;
    this.noiseOut = 1;
    this.latchCh = 0;
    this.latchType = 0;
  }

  // Escrita de um byte. Bit 7 = 1: "latch" (canal, tipo, 4 bits). Bit 7 = 0: 6 bits altos do tom.
  write(v) {
    v &= 0xFF;
    if (v & 0x80) {
      const ch = (v >> 5) & 3, type = (v >> 4) & 1, d = v & 15;
      this.latchCh = ch;
      this.latchType = type;
      if (type) this.vol[ch] = d;
      else if (ch < 3) this.tone[ch] = (this.tone[ch] & 0x3F0) | d;
      else this.setNoise(d);
    } else if (this.latchType === 0 && this.latchCh < 3) {
      this.tone[this.latchCh] = (this.tone[this.latchCh] & 0x00F) | ((v & 0x3F) << 4);
    }
  }

  setNoise(d) {
    this.noiseWhite = (d & 4) !== 0;
    this.noiseRate = d & 3;
    this.lfsr = 0x8000;
  }

  // Um tick = 16 ciclos do relógio do PSG
  tick() {
    for (let c = 0; c < 3; c++) {
      if (--this.toneCnt[c] <= 0) {
        this.toneCnt[c] = this.tone[c] || 0x400;
        this.toneOut[c] ^= 1;
      }
    }
    if (--this.noiseCnt <= 0) {
      this.noiseCnt = this.noiseRate === 3 ? (this.tone[2] || 0x400) : (16 << this.noiseRate);
      const fb = this.noiseWhite ? ((this.lfsr & 1) ^ ((this.lfsr >> 3) & 1)) : (this.lfsr & 1);
      this.lfsr = (this.lfsr >> 1) | (fb << 15);
      this.noiseOut = this.lfsr & 1;
    }
  }

  // Nível de saída atual (aprox. -1..1 antes do ganho geral)
  level() {
    let s = 0;
    for (let c = 0; c < 3; c++) s += (this.toneOut[c] ? 1 : -1) * PSG_VOL[this.vol[c]];
    s += (this.noiseOut ? 1 : -1) * PSG_VOL[this.vol[3]];
    return s * 0.05;
  }
}

<script>
// ============ YM2612 (FM do Mega Drive) ============
// 6 canais, 4 operadores por canal, 8 algoritmos, envelope ADSR aproximado,
// timers A/B (com flags de status) e canal 6 como DAC de 8 bits.
// Simplificações: sem LFO, sem SSG-EG, sem detune (DT); a saída é mono.
// Otimizado: tabelas para envelope e seno, sem alocação por amostra.
const YM_CLK = 7670453;                 // relógio do YM (igual ao do 68000)
const YM_RATE = YM_CLK / 144;           // ~53267 amostras por segundo
const YM_LUT = new Float64Array(2048);  // unidades de atenuação -> amplitude
for (let u = 0; u < 2048; u++) YM_LUT[u] = Math.pow(10, -(u * 96 / 1023) / 20);
const YM_SIN = new Float64Array(1024);  // uma volta da senoide, 1024 pontos
for (let i = 0; i < 1024; i++) YM_SIN[i] = Math.sin(2 * Math.PI * i / 1024);

// m[operador] = operadores que o modulam; c = operadores ligados à saída.
// Operadores: 0 = S1, 1 = S2, 2 = S3, 3 = S4
const YM_ALG = [
  { m: { 1: [0], 2: [1], 3: [2] }, c: [3] },
  { m: { 2: [0, 1], 3: [2] }, c: [3] },
  { m: { 2: [1], 3: [0, 2] }, c: [3] },
  { m: { 1: [0], 3: [1, 2] }, c: [3] },
  { m: { 1: [0], 3: [2] }, c: [1, 3] },
  { m: { 1: [0], 2: [0], 3: [0] }, c: [1, 2, 3] },
  { m: { 1: [0] }, c: [1, 2, 3] },
  { m: {}, c: [0, 1, 2, 3] },
];
// Mesma informação, em listas prontas (sem busca de objeto a cada amostra)
const YM_ALG_FAST = YM_ALG.map(a => ({
  mods: [0, 1, 2, 3].map(i => (a.m[i] || []).slice()),
  car: a.c.slice(),
}));
const YM_OP_FROM_REG = [0, 2, 1, 3];   // a ordem dos registros (S1, S3, S2, S4) -> operador
const YM_MOD_SCALE = 0.5;              // profundidade da modulação, em voltas da senoide

// Taxa de queda do envelope (unidades por amostra), para o código de taxa k (0..63)
function ymLin(k) {
  if (k === 0) return 0;
  return Math.pow(2, k >> 2) * ((k & 3) + 4) / 4096;
}
const YM_LIN = new Float64Array(64);
for (let k = 0; k < 64; k++) YM_LIN[k] = ymLin(k);

// Código de taxa efetivo: r = taxa do registrador (0 = parada), extra = 1 na liberação, ks = escala por tecla
function ymRate(r, extra, ks) {
  return r ? Math.min(63, 2 * r + extra + ks) : 0;
}

class YMOp {
  constructor() {
    this.mul = 1; this.tl = 0; this.tl8 = 0; this.ar = 0; this.dr = 0; this.sr = 0; this.rr = 0; this.sl = 0; this.rs = 0;
    this.inc = 0;        // avanço da fase, em voltas por amostra
    this.phase = 0;
    this.env = 1023;     // atenuação do envelope (0 = máximo, 1023 = silêncio)
    this.state = 4;      // 0 ataque, 1 decaimento, 2 sustentação, 3 liberação, 4 desligado
  }
  setFreq(fnum, block) {
    this.inc = fnum * Math.pow(2, block) / 2097152 * (this.mul ? this.mul : 0.5);
  }
  keyOn() { this.state = 0; this.phase = 0; }
  keyOff() { if (this.state < 3) this.state = 3; }

  envStep(kc) {
    const ks = kc >> (3 - this.rs);
    switch (this.state) {
      case 0: {   // ataque (exponencial até zero)
        if (this.ar === 0) break;
        const k = ymRate(this.ar, 0, ks);
        if (k >= 62) this.env = 0;
        else this.env -= this.env * Math.min(1, YM_LIN[k] / 128);
        if (this.env < 1) { this.env = 0; this.state = 1; }
        break;
      }
      case 1: {   // decaimento até o nível de sustentação
        this.env += YM_LIN[ymRate(this.dr, 0, ks)];
        const sl = this.sl === 15 ? 1023 : this.sl * 32;
        if (this.env >= sl) { this.env = sl; this.state = 2; }
        break;
      }
      case 2:     // sustentação
        this.env = Math.min(1023, this.env + YM_LIN[ymRate(this.sr, 0, ks)]);
        break;
      case 3:     // liberação
        this.env = Math.min(1023, this.env + YM_LIN[ymRate(this.rr, 1, ks)]);
        if (this.env >= 1023) this.state = 4;
        break;
      default:
        this.env = 1023;
    }
  }

  // mod: modulação recebida (em voltas); kc: código de tecla do canal
  tick(mod, kc) {
    this.envStep(kc);
    const s = YM_SIN[((this.phase + mod) * 1024) & 1023];
    this.phase += this.inc;
    this.phase -= Math.floor(this.phase);
    let u = (this.env + this.tl8 + 0.5) | 0;
    if (u > 2047) u = 2047;
    return s * YM_LUT[u];
  }
}

class YMChan {
  constructor() {
    this.ops = [new YMOp(), new YMOp(), new YMOp(), new YMOp()];
    this.fnum = 0; this.block = 0; this.kc = 0; this.alg = 0; this.fb = 0;
    this.left = true; this.right = true;
    this.p1 = 0; this.p2 = 0;   // últimas saídas do S1 (para realimentação)
    this.y = new Float64Array(4);
  }
  setFreq(fnum, block) {
    this.fnum = fnum; this.block = block;
    this.kc = (block << 2) | (fnum >> 9);
    for (const o of this.ops) o.setFreq(fnum, block);
  }
  sample() {
    const A = YM_ALG_FAST[this.alg];
    const y = this.y, ops = this.ops, kc = this.kc, fb = this.fb;
    for (let i = 0; i < 4; i++) {
      let mod = 0;
      const m = A.mods[i];
      for (let j = 0; j < m.length; j++) mod += y[m[j]];
      mod *= YM_MOD_SCALE;
      if (i === 0 && fb) mod += (this.p1 + this.p2) * 0.5 * fb * 0.08;
      y[i] = ops[i].tick(mod, kc);
    }
    this.p2 = this.p1;
    this.p1 = y[0];
    const c = A.car;
    let out = 0;
    for (let j = 0; j < c.length; j++) out += y[c[j]];
    return out;
  }
}

class YM2612 {
  constructor() {
    this.regs = [new Uint8Array(256), new Uint8Array(256)];
    this.addr = [0, 0];
    this.chans = [];
    for (let i = 0; i < 6; i++) this.chans.push(new YMChan());
    this.hi = [0, 0, 0, 0, 0, 0];   // parte alta da frequência (A4-A6), guardada até o A0-A2
    this.status = 0;
    this.dac = 128;
    this.dacOn = false;
    this.accA = 0; this.accB = 0; this.clk = 0;
  }

  readStatus() { return this.status; }

  // part 0 ou 1; data = 0 escreve no registrador de endereço, data = 1 escreve o valor
  port(part, data, v) {
    if (!data) { this.addr[part] = v & 0xFF; return; }
    this.write(part, this.addr[part], v & 0xFF);
  }

  write(part, r, v) {
    this.regs[part][r] = v;
    if (part === 0) {
      if (r === 0x27) {
        if (v & 0x10) this.status &= ~1;
        if (v & 0x20) this.status &= ~2;
        return;
      }
      if (r === 0x28) {
        if ((v & 3) === 3) return;
        const ch = (v & 3) + ((v & 4) ? 3 : 0);
        for (let b = 0; b < 4; b++) {
          if (v & (0x10 << b)) this.chans[ch].ops[b].keyOn();
          else this.chans[ch].ops[b].keyOff();
        }
        return;
      }
      if (r === 0x2A) { this.dac = v; return; }
      if (r === 0x2B) { this.dacOn = (v & 0x80) !== 0; return; }
    }
    if (r < 0x30) return;
    const n = r & 3;
    if (n === 3) return;
    const idx = n + (part ? 3 : 0);
    const c = this.chans[idx];
    const hi = r & 0xF0;

    if (r < 0xA0) {   // parâmetros de operador
      const o = c.ops[YM_OP_FROM_REG[(r >> 2) & 3]];
      switch (hi) {
        case 0x30: o.mul = v & 15; o.setFreq(c.fnum, c.block); break;
        case 0x40: o.tl = v & 127; o.tl8 = o.tl * 8; break;
        case 0x50: o.rs = v >> 6; o.ar = v & 31; break;
        case 0x60: o.dr = v & 31; break;
        case 0x70: o.sr = v & 31; break;
        case 0x80: o.sl = v >> 4; o.rr = v & 15; break;
      }
      return;
    }
    if (r < 0xA8) {   // frequência do canal
      if (r >= 0xA4) { this.hi[idx] = v; return; }
      c.setFreq(((this.hi[idx] & 7) << 8) | v, (this.hi[idx] >> 3) & 7);
      return;
    }
    if (r >= 0xB0 && r < 0xB8) {
      if (r < 0xB4) { c.alg = v & 7; c.fb = (v >> 3) & 7; }
      else { c.left = (v & 0x80) !== 0; c.right = (v & 0x40) !== 0; }
    }
  }

  // Avança os timers e gera amostras para "clocks" ciclos do 68000 (= relógio do YM)
  advance(clocks, emit) {
    const r = this.regs[0], ctrl = r[0x27];
    if (ctrl & 1) {
      this.accA += clocks;
      const period = 108 * (1024 - ((r[0x24] << 2) | (r[0x25] & 3)));
      while (this.accA >= period) { this.accA -= period; if (ctrl & 4) this.status |= 1; }
    } else this.accA = 0;
    if (ctrl & 2) {
      this.accB += clocks;
      const period = 1728 * (256 - r[0x26]);
      while (this.accB >= period) { this.accB -= period; if (ctrl & 8) this.status |= 2; }
    } else this.accB = 0;

    this.clk += clocks;
    while (this.clk >= 144) { this.clk -= 144; emit(this.render()); }
  }

  render() {
    let s = 0;
    for (let i = 0; i < 6; i++) {
      const c = this.chans[i];
      if (!c.left && !c.right) continue;
      let o;
      if (i === 5 && this.dacOn) o = ((this.dac - 128) / 128) * 0.9;
      else o = c.sample();
      s += o * 0.08;
    }
    return s;
  }
}

<script>
// ============ Som do Mega Drive ============
// Z80 (driver de som, 8 KB de RAM), YM2612 (FM) e SN76489 (PSG).
// Mapa de memória do Z80:
//   $0000-$3FFF  RAM de 8 KB (espelhada)
//   $4000-$4003  YM2612
//   $6000        registrador de banco (9 escritas, bit 0 primeiro)
//   $7F10-$7F17  PSG
//   $8000-$FFFF  janela para o 68000, no endereço (banco << 15) + offset
// A saída é mono, a 53267 Hz (YM), reamostrada para a taxa do navegador.
const MD_Z80_RATIO = 3579545 / 7670453;  // ciclos do Z80 por ciclo do 68000
const MD_PSG_RATIO = 3579545 / 7670453;  // o PSG usa o relógio do Z80
const MD_RING = 1 << 16;

class MDSound {
  constructor(machine) {
    this.m = machine;
    this.ram = new Uint8Array(0x2000);
    this.ym = new YM2612();
    this.psg = new PSG();
    this.bankReg = 0;
    this.z80 = new Z80({ read: a => this.zRead(a), write: (a, v) => this.zWrite(a, v) });
    this.z80Debt = 0;
    this.psgAcc = 0;
    this.ring = new Float32Array(MD_RING);
    this.wr = 0;
    this.rd = 0;
    this.ratio = YM_RATE / 44100;
  }

  setOutRate(r) { this.ratio = YM_RATE / r; }

  // O Z80 roda quando está solto do reset e o 68000 não pediu o barramento
  running() { return (this.m.z80Reset & 0x100) !== 0 && (this.m.z80Bus & 0x100) === 0; }

  resetZ80() {
    const z = this.z80;
    z.PC = 0; z.IFF1 = 0; z.IFF2 = 0; z.IM = 0;
    z.halted = false; z.intLine = false; z.prefix = 0; z.I = 0; z.R = 0;
  }

  // Avança o som em "clocks" ciclos do 68000
  advance(clocks) {
    if (this.running()) {
      this.z80Debt += clocks * MD_Z80_RATIO;
      while (this.z80Debt > 0) this.z80Debt -= this.z80.step();
    } else this.z80Debt = 0;
    this.psgAcc += clocks * MD_PSG_RATIO;
    while (this.psgAcc >= 16) { this.psgAcc -= 16; this.psg.tick(); }
    this.ym.advance(clocks, s => this.push(s + this.psg.level()));
  }

  zRead(a) {
    a &= 0xFFFF;
    if (a < 0x4000) return this.ram[a & 0x1FFF];
    if (a < 0x6000) return this.ym.readStatus();
    if (a >= 0x8000) return this.m.read8(this.bankReg * 0x8000 + (a & 0x7FFF));
    return 0xFF;
  }

  zWrite(a, v) {
    a &= 0xFFFF;
    v &= 0xFF;
    if (a < 0x4000) { this.ram[a & 0x1FFF] = v; return; }
    if (a < 0x4004) { this.ym.port((a >> 1) & 1, a & 1, v); return; }
    if (a >= 0x6000 && a < 0x6100) {
      this.bankReg = ((this.bankReg >> 1) | ((v & 1) << 8)) & 0x1FF;
      return;
    }
    if (a >= 0x7F10 && a < 0x7F18) { this.psg.write(v); return; }
    if (a >= 0x8000) this.m.write8(this.bankReg * 0x8000 + (a & 0x7FFF), v);
  }

  // Amostras de saída (fila circular; o áudio puxa com pull())
  push(s) {
    if (s > 1) s = 1; else if (s < -1) s = -1;
    this.ring[this.wr & (MD_RING - 1)] = s;
    this.wr++;
    if (this.wr - this.rd > MD_RING / 4) this.rd = this.wr - 4096;   // atraso grande demais: descarta
  }

  pull() {
    if (this.wr - this.rd < 2) return 0;
    const i = Math.floor(this.rd), f = this.rd - i;
    const a = this.ring[i & (MD_RING - 1)], b = this.ring[(i + 1) & (MD_RING - 1)];
    this.rd += this.ratio;
    return a + (b - a) * f;
  }
}

<script>
// ============ VDP do Mega Drive (vídeo) ============
// VRAM de 64 KB, CRAM de 64 cores (9 bits), VSRAM de 40 entradas e 24 registradores.
// Desenha linha por linha: fundo cor, plano B, plano A (com janela), sprites, com prioridades.
// Limitações: sem modo de sombra/realce, sem modo entrelaçado, rolagem por linha/célula só no que é usado,
// e DMA instantâneo (não ocupa ciclos da CPU).

const MD_CELLS_W = [32, 64, 32, 128];

class MDVDP {
  constructor() {
    this.vram = new Uint8Array(0x10000);
    this.cram = new Uint16Array(64);
    this.vsram = new Uint16Array(40);
    this.reg = new Uint8Array(24);
    this.addr = 0; this.code = 0;
    this.pending = false; this.firstWord = 0;
    this.fillPending = false;
    this.dmaRead = () => 0;            // leitura de palavra do barramento do 68000 (para DMA)
    this.width = 320;
    this.framebuffer = new Uint8ClampedArray(320 * 224 * 4);
    this.cramR = new Uint8Array(64); this.cramG = new Uint8Array(64); this.cramB = new Uint8Array(64);
    // Buffers da linha: cor e prioridade de cada plano, e sprites por prioridade (-1 = transparente)
    this.aCol = new Int16Array(320); this.aPri = new Uint8Array(320);
    this.bCol = new Int16Array(320); this.bPri = new Uint8Array(320);
    this.sCol0 = new Int16Array(320); this.sCol1 = new Int16Array(320);
    this.vblank = false; this.hblank = false;
    this.line = 0;
    this.oddFrame = false;
    this.hCount = 0;
  }

  // ---------- Registradores ----------
  setReg(r, v) {
    this.reg[r] = v;
  }

  // ---------- Porta de controle ----------
  writeControl(v) {
    if (!this.pending && (v & 0xC000) === 0x8000) {
      this.setReg((v >> 8) & 0x1F, v & 0xFF);
      return;
    }
    if (!this.pending) { this.firstWord = v; this.pending = true; return; }
    this.pending = false;
    const first = this.firstWord;
    this.addr = (first & 0x3FFF) | ((v & 3) << 14);
    this.code = ((first >> 14) & 3) | ((v >> 2) & 0x3C);
    if ((this.code & 0x20) && (this.reg[1] & 0x10)) this.startDma();
  }

  // Estado da porta de controle: VBlank, HBlank e quadro ímpar
  readStatus() {
    this.pending = false;
    return 0x3400 | (this.vblank ? 0x08 : 0) | (this.hblank ? 0x04 : 0) | (this.oddFrame ? 0x10 : 0);
  }

  // Contador de linhas e de colunas (aproximado)
  readHV() {
    return ((this.line & 0xFF) << 8) | (this.hCount & 0xFF);
  }

  // ---------- Porta de dados ----------
  writeData(v) {
    if (this.fillPending) { this.doFill(v); this.fillPending = false; return; }
    this.writeWord(v);
  }
  writeWord(v) {
    const c = this.code & 0x1F;
    const a = this.addr;
    if (c === 1) {
      this.vram[a & 0xFFFF] = v >> 8;
      this.vram[(a + 1) & 0xFFFF] = v & 0xFF;
    } else if (c === 3) {
      const i = (a >> 1) & 0x3F;
      this.cram[i] = v & 0x0EEE;
      this.updateColor(i);
    } else if (c === 5) {
      const i = (a >> 1) % 40;
      this.vsram[i] = v & 0x7FF;
    }
    this.addr = (a + this.reg[15]) & 0xFFFF;
  }
  readData() {
    const c = this.code & 0x1F;
    const a = this.addr;
    let v = 0;
    if (c === 0) v = (this.vram[a & 0xFFFF] << 8) | this.vram[(a + 1) & 0xFFFF];
    else if (c === 8) v = this.cram[(a >> 1) & 0x3F];
    else if (c === 4) v = this.vsram[(a >> 1) % 40];
    this.addr = (a + this.reg[15]) & 0xFFFF;
    return v;
  }

  updateColor(i) {
    const v = this.cram[i];
    this.cramR[i] = Math.round((((v >> 1) & 7)) * 255 / 7);
    this.cramG[i] = Math.round((((v >> 5) & 7)) * 255 / 7);
    this.cramB[i] = Math.round((((v >> 9) & 7)) * 255 / 7);
  }

  // ---------- DMA ----------
  startDma() {
    const r = this.reg;
    const len = (r[19] | (r[20] << 8)) || 0x10000;
    const mode = r[23] & 0xC0;
    if (mode === 0x80) { this.fillPending = true; this.fillLen = len; return; }   // preenchimento: espera o dado
    if (mode === 0xC0) {                                                          // cópia VRAM -> VRAM
      let src = ((r[21] | (r[22] << 8)) << 1) & 0xFFFF;
      let dst = this.addr;
      for (let i = 0; i < len; i++) {
        this.vram[dst & 0xFFFF] = this.vram[src & 0xFFFF];
        dst = (dst + r[15]) & 0xFFFF;
        src = (src + 1) & 0xFFFF;
      }
      this.addr = dst;
      return;
    }
    // 68000 -> VDP
    let src = ((r[21] | (r[22] << 8) | ((r[23] & 0x7F) << 16)) << 1) >>> 0;
    for (let i = 0; i < len; i++) {
      this.writeWord(this.dmaRead(src));
      src = (src + 2) >>> 0;
    }
  }
  doFill(v) {
    const byte = (v >> 8) & 0xFF;
    const inc = this.reg[15];
    let a = this.addr;
    for (let i = 0; i < this.fillLen; i++) {
      this.vram[(a ^ 1) & 0xFFFF] = byte;
      a = (a + inc) & 0xFFFF;
    }
    this.addr = a;
  }

  // ---------- Desenho ----------
  // Rolagem horizontal do plano (A = 0, B = 1) nesta linha
  hscroll(plane, y) {
    const r = this.reg;
    const base = (r[13] & 0x3F) << 10;
    const mode = r[11] & 3;
    const idx = mode === 2 ? (y >> 3) : mode === 3 ? y : 0;
    const a = (base + idx * 4 + (plane ? 2 : 0)) & 0xFFFF;
    return ((this.vram[a] << 8) | this.vram[a + 1]) & 0x3FF;
  }
  // Rolagem vertical por coluna (modo de 2 células) ou da tela inteira
  vscroll(plane, x) {
    if (this.reg[11] & 4) {
      const i = (x >> 4) * 2 + plane;
      return i < 40 ? this.vsram[i] & 0x3FF : 0;
    }
    return this.vsram[plane] & 0x3FF;
  }

  inWindow(x, y) {
    const r = this.reg;
    const wx = (r[17] & 0x1F) * 16, wy = (r[18] & 0x1F) * 8;
    const hIn = (r[17] & 0x80) ? x >= wx : x < wx;
    const vIn = (r[18] & 0x80) ? y >= wy : y < wy;
    return hIn && vIn;
  }

  // Uma linha de um plano (A ou B): cor (-1 = transparente) e prioridade de cada pixel
  planeLine(isA, y, hs, W, col, pri) {
    const r = this.reg, vram = this.vram;
    const wx = (r[17] & 0x1F) * 16, wy = (r[18] & 0x1F) * 8;
    const wRight = (r[17] & 0x80) !== 0;
    const vIn = (r[18] & 0x80) ? y >= wy : y < wy;
    const base = isA ? (r[2] & 0x38) << 10 : (r[4] & 7) << 13;
    const wBase = (r[3] & 0x3E) << 10;
    const cellsW = MD_CELLS_W[r[16] & 3];
    const cellsH = MD_CELLS_W[(r[16] >> 4) & 3];
    const pw = cellsW * 8, ph = cellsH * 8;
    const wCellsW = W === 320 ? 64 : 32;
    const vsPlane = isA ? 0 : 1;
    const colScroll = (r[11] & 4) !== 0;
    const vsConst = this.vsram[vsPlane] & 0x3FF;
    let lastAi = -1, e = 0;     // a última célula lida (várias colunas caem na mesma célula)
    for (let x = 0; x < W; x++) {
      let ai, px, py;
      const hIn = wRight ? x >= wx : x < wx;
      if (isA && hIn && vIn) {
        px = x; py = y;
        ai = wBase + ((py >> 3) * wCellsW + (px >> 3)) * 2;
      } else {
        px = (x - hs) & (pw - 1);
        const vs = colScroll ? this.vscroll(vsPlane, x) : vsConst;
        py = (y + vs) & (ph - 1);
        ai = base + ((py >> 3) * cellsW + (px >> 3)) * 2;
      }
      ai &= 0xFFFF;
      if (ai !== lastAi) {
        e = (vram[ai] << 8) | vram[ai + 1];
        lastAi = ai;
      }
      const tile = e & 0x7FF;
      const trow = (e & 0x1000) ? 7 - (py & 7) : (py & 7);
      const tcol = (e & 0x800) ? 7 - (px & 7) : (px & 7);
      const b = vram[(tile * 32 + trow * 4 + (tcol >> 1)) & 0xFFFF];
      const c = (tcol & 1) ? (b & 0xF) : (b >> 4);
      pri[x] = (e >> 15) & 1;
      col[x] = c === 0 ? -1 : ((e >> 13) & 3) * 16 + c;
    }
  }

  renderLine(y) {
    const r = this.reg;
    const W = this.width = ((r[12] & 0x81) === 0x81) ? 320 : 256;
    const fb = this.framebuffer;
    const bgIdx = ((r[7] >> 4) & 3) * 16 + (r[7] & 15);
    const bgR = this.cramR[bgIdx], bgG = this.cramG[bgIdx], bgB = this.cramB[bgIdx];
    const o0 = y * 320 * 4;
    // Fundo: a linha inteira com a cor de fundo (inclui as bordas no modo de 256 pixels)
    for (let x = 0; x < 320; x++) {
      const o = o0 + x * 4;
      fb[o] = bgR; fb[o + 1] = bgG; fb[o + 2] = bgB; fb[o + 3] = 255;
    }
    if (!(r[1] & 0x40)) return;          // tela desligada: só a cor de fundo
    const xOff = (320 - W) >> 1;

    // Sprites da linha (até 20), na ordem da lista ligada a partir do sprite 0
    const sprites = [];
    const sat = (r[5] & 0x7F) << 9;
    let link = 0;
    for (let n = 0; n < 80 && sprites.length < 20; n++) {
      const a = (sat + link * 8) & 0xFFFF;
      const w0 = (this.vram[a] << 8) | this.vram[a + 1];
      const w1 = (this.vram[a + 2] << 8) | this.vram[a + 3];
      const w2 = (this.vram[a + 4] << 8) | this.vram[a + 5];
      const w3 = (this.vram[a + 6] << 8) | this.vram[a + 7];
      const sy = (w0 & 0x3FF) - 128;
      const vs = (w1 >> 8) & 3, hs = (w1 >> 10) & 3;
      if (y >= sy && y < sy + (vs + 1) * 8) {
        sprites.push({ w2, sx: (w3 & 0x1FF) - 128, row: y - sy, hs, vs });
      }
      link = w1 & 0x7F;
      if (link === 0) break;
    }

    // Cada plano é lido uma vez por linha; a prioridade é resolvida depois
    this.planeLine(true, y, this.hscroll(0, y), W, this.aCol, this.aPri);
    this.planeLine(false, y, this.hscroll(1, y), W, this.bCol, this.bPri);

    // Sprites separados por prioridade (o primeiro da lista fica por cima: desenha de trás para frente)
    const sc = [this.sCol0, this.sCol1];
    sc[0].fill(-1, 0, W); sc[1].fill(-1, 0, W);
    for (let k = sprites.length - 1; k >= 0; k--) {
      const s = sprites[k];
      const prio = (s.w2 >> 15) & 1;
      const out = sc[prio];
      const hc = s.hs + 1, vc = s.vs + 1;
      const hf = (s.w2 >> 11) & 1, vf = (s.w2 >> 12) & 1;
      const pal = (s.w2 >> 13) & 3;
      const baseTile = s.w2 & 0x7FF;
      for (let col = 0; col < hc * 8; col++) {
        const x = s.sx + col;
        if (x < 0 || x >= W) continue;
        const cx = col >> 3, cy = s.row >> 3;
        const ecx = hf ? (hc - 1 - cx) : cx;
        const ecy = vf ? (vc - 1 - cy) : cy;
        const tile = (baseTile + ecx * vc + ecy) & 0x7FF;
        const tcol = hf ? 7 - (col & 7) : (col & 7);
        const trow = vf ? 7 - (s.row & 7) : (s.row & 7);
        const b = this.vram[(tile * 32 + trow * 4 + (tcol >> 1)) & 0xFFFF];
        const c = (tcol & 1) ? (b & 0xF) : (b >> 4);
        if (c !== 0) out[x] = pal * 16 + c;
      }
    }

    // Composição: do mais alto para o mais baixo: sprites alta, A alta, B alta, sprites baixa, A baixa, B baixa
    const aCol = this.aCol, aPri = this.aPri, bCol = this.bCol, bPri = this.bPri;
    const s0 = this.sCol0, s1 = this.sCol1;
    for (let x = 0; x < W; x++) {
      let idx;
      if (s1[x] >= 0) idx = s1[x];
      else if (aCol[x] >= 0 && aPri[x] === 1) idx = aCol[x];
      else if (bCol[x] >= 0 && bPri[x] === 1) idx = bCol[x];
      else if (s0[x] >= 0) idx = s0[x];
      else if (aCol[x] >= 0 && aPri[x] === 0) idx = aCol[x];
      else if (bCol[x] >= 0 && bPri[x] === 0) idx = bCol[x];
      else continue;
      const o = o0 + (x + xOff) * 4;
      fb[o] = this.cramR[idx]; fb[o + 1] = this.cramG[idx]; fb[o + 2] = this.cramB[idx];
    }
  }
}

<script>
// ============ Console Mega Drive (liga 68000, VDP, Z80 + som, memória, controle e laço de quadro) ============
// Mapa de memória do 68000:
//   $000000-$3FFFFF  cartucho (ROM)
//   $A00000-$A03FFF  RAM do Z80 (8 KB espelhada)
//   $A04000-$A04003  YM2612 (som FM)
//   $A10000-$A1001F  versão e controles
//   $A11100          pedido de barramento do Z80 (bit 8; 0 = concedido)
//   $A11200          reset do Z80 (bit 8; 0 = em reset, 1 = solto)
//   $C00000-$DFFFFF  VDP (dados, controle, contador de linhas) e PSG ($C00011)
//   $E00000-$FFFFFF  RAM de 64 KB (espelhada)
// Limitações: a ROM fora do tamanho devolve $FFFF.

const MD_BUTTON = { up: 0x01, down: 0x02, left: 0x04, right: 0x08, b: 0x10, c: 0x20, a: 0x40, start: 0x80 };
const MD_LINES = 262;        // linhas por quadro (NTSC)
const MD_ACTIVE = 224;       // linhas visíveis
const MD_CYCLES_LINE = 488;  // ciclos do 68000 por linha

class MegaDrive {
  // romBytes: Uint8Array já decodificado (.md/.gen/.bin); o SMD deve ser convertido antes
  constructor(romBytes) {
    this.rom = romBytes;
    this.ram = new Uint8Array(0x10000);
    this.vdp = new MDVDP();
    this.vdp.dmaRead = a => this.read16(a);
    this.pad = [0, 0];            // botões de cada controle (bits de MD_BUTTON, 1 = pressionado)
    this.ioData = [0x40, 0x40];   // valor escrito na porta de dados de cada controle (bit 6 = TH)
    this.z80Bus = 0;
    this.z80Reset = 0;            // 0 = Z80 em reset; 0x100 = solto
    this.sound = new MDSound(this);
    this.bus = {
      read8: a => this.read8(a),
      read16: a => this.read16(a),
      write8: (a, v) => this.write8(a, v),
      write16: (a, v) => this.write16(a, v),
    };
    this.cpu = new M68K(this.bus);
    this.cpu.reset();
  }

  // ---------- Barramento do Z80 (pedido e reset) ----------
  setZ80Bus(x) { this.z80Bus = x & 0x100; }
  setZ80Reset(x) {
    const release = x & 0x100;
    if (release && !(this.z80Reset & 0x100)) this.sound.resetZ80();
    this.z80Reset = release;
  }

  // ---------- Barramento do 68000 ----------
  read16(a) {
    a &= 0xFFFFFF;
    if (a < 0x400000) {
      if (a + 1 < this.rom.length) return (this.rom[a] << 8) | this.rom[a + 1];
      return 0xFFFF;
    }
    if (a >= 0xE00000) { const i = a & 0xFFFF; return (this.ram[i] << 8) | this.ram[(i + 1) & 0xFFFF]; }
    if (a >= 0xC00000 && a < 0xE00000) {
      const off = a & 0x1F;
      if (off < 4) return this.vdp.readData();
      if (off < 8) return this.vdp.readStatus();
      if (off < 0x10) return this.vdp.readHV();
      return 0xFFFF;
    }
    if (a >= 0xA10000 && a < 0xA10020) {
      if (a === 0xA10000) return 0x00A0;                          // versão do console (lê no byte baixo)
      return (this.readPort(0) << 8) | this.readPort(1);
    }
    if (a >= 0xA11100 && a < 0xA11200) return (this.z80Bus & 0x100) ? 0x0000 : 0x0100;
    if (a >= 0xA00000 && a < 0xA04000) { const i = a & 0x1FFF; return (this.sound.ram[i] << 8) | this.sound.ram[(i + 1) & 0x1FFF]; }
    if (a >= 0xA04000 && a < 0xA04004) return this.sound.ym.readStatus() << 8;
    if (a >= 0xA00000 && a < 0xA10000) return 0x0000;
    return 0xFFFF;
  }
  write16(a, v) {
    a &= 0xFFFFFF;
    v &= 0xFFFF;
    if (a < 0x400000) return;                                    // ROM não se escreve
    if (a >= 0xE00000) { const i = a & 0xFFFF; this.ram[i] = v >> 8; this.ram[(i + 1) & 0xFFFF] = v & 0xFF; return; }
    if (a >= 0xC00000 && a < 0xE00000) {
      const off = a & 0x1F;
      if (off < 4) this.vdp.writeData(v);
      else if (off < 8) this.vdp.writeControl(v);
      else if (off >= 0x10 && off < 0x18) this.sound.psg.write(v & 0xFF);
      return;
    }
    if (a >= 0xA10000 && a < 0xA10020) {
      this.write8(a, v >> 8); this.write8(a + 1, v & 0xFF);
      return;
    }
    if (a >= 0xA11100 && a < 0xA11200) { this.setZ80Bus(v); return; }
    if (a >= 0xA11200 && a < 0xA11300) { this.setZ80Reset(v); return; }
    if (a >= 0xA00000 && a < 0xA10000) { this.write8(a, v >> 8); this.write8(a + 1, v & 0xFF); return; }
  }
  read8(a) {
    a &= 0xFFFFFF;
    if (a >= 0xA10000 && a < 0xA10020) {
      const off = a & 0x1F;
      if (off === 1) return 0x00A0;                              // versão
      if (off === 3) return this.readPort(0);
      if (off === 5) return this.readPort(1);
      return 0;
    }
    const v = this.read16(a & ~1);
    return (a & 1) ? (v & 0xFF) : (v >> 8);
  }
  write8(a, v) {
    a &= 0xFFFFFF;
    v &= 0xFF;
    if (a >= 0xE00000) { this.ram[a & 0xFFFF] = v; return; }
    if (a >= 0xA10000 && a < 0xA10020) {
      const off = a & 0x1F;
      if (off === 3) this.ioData[0] = v;
      else if (off === 5) this.ioData[1] = v;
      return;
    }
    if (a >= 0xA00000 && a < 0xA04000) { this.sound.ram[a & 0x1FFF] = v; return; }
    if (a >= 0xA04000 && a < 0xA04004) { this.sound.ym.port((a >> 1) & 1, a & 1, v); return; }
    if (a >= 0xC00000 && a < 0xE00000) {
      const off = a & 0x1F;
      if (off < 4) this.vdp.writeData((v << 8) | v);
      else if (off < 8) this.vdp.writeControl((v << 8) | v);
      else if (off >= 0x10 && off < 0x18) this.sound.psg.write(v);
      return;
    }
    if (a === 0xA11100) { this.setZ80Bus((v & 1) ? 0x100 : 0); return; }
    if (a === 0xA11200) { this.setZ80Reset((v & 1) ? 0x100 : 0); return; }
  }

  // Controle de 3 botões: com TH = 1 lê C/B e direções; com TH = 0 lê A/Start e direções para cima/baixo
  readPort(n) {
    const pressed = this.pad[n];
    const th = (this.ioData[n] & 0x40) !== 0;
    const up = (pressed & MD_BUTTON.up) !== 0, down = (pressed & MD_BUTTON.down) !== 0;
    const left = (pressed & MD_BUTTON.left) !== 0, right = (pressed & MD_BUTTON.right) !== 0;
    const b = (pressed & MD_BUTTON.b) !== 0, c = (pressed & MD_BUTTON.c) !== 0;
    const a = (pressed & MD_BUTTON.a) !== 0, start = (pressed & MD_BUTTON.start) !== 0;
    let v = 0x40;   // bit 6 (TH) é sempre lido igual ao que foi escrito
    if (th) {
      v |= (up ? 0 : 1) | (down ? 0 : 2) | (left ? 0 : 4) | (right ? 0 : 8) | (b ? 0 : 0x10) | (c ? 0 : 0x20);
    } else {
      v |= (up ? 0 : 1) | (down ? 0 : 2) | (a ? 0 : 0x10) | (start ? 0 : 0x20);
    }
    return v & 0x7F;
  }
  setButton(n, name, down) {
    const bit = MD_BUTTON[name];
    if (!bit) return;
    if (down) this.pad[n] |= bit; else this.pad[n] &= ~bit;
  }

  // ---------- Laço do quadro ----------
  requestIrq(level) { if (level > this.cpu.irqLevel) this.cpu.irqLevel = level; }

  runFrame() {
    const r = this.vdp.reg;
    for (let line = 0; line < MD_LINES; line++) {
      this.vdp.line = line;
      let spent = 0;
      while (spent < MD_CYCLES_LINE) spent += this.cpu.step();
      this.sound.advance(spent);

      if (line < MD_ACTIVE) {
        this.vdp.hblank = false;
        this.vdp.renderLine(line);
        // Interrupção de HBlank: contador em R10 (reinicia a cada linha)
        if (this.vdp.hCount <= 0) {
          this.vdp.hCount = r[10];
          if (r[0] & 0x10) this.requestIrq(4);
        } else this.vdp.hCount--;
      }
      if (line === MD_ACTIVE) {
        this.vdp.vblank = true;
        this.vdp.hCount = r[10];
        if (r[1] & 0x20) this.requestIrq(6);
        this.sound.z80.intLine = true;      // interrupção de quadro para o driver de som
      }
      if (line === MD_ACTIVE + 1) this.sound.z80.intLine = false;
      if (line === 0) this.vdp.vblank = false;
    }
    this.vdp.oddFrame = !this.vdp.oddFrame;
  }
}

// Converte um arquivo de ROM do Mega Drive para o formato linear.
// .smd tem cabeçalho de 512 bytes e blocos de 16 KB com os bytes pares e ímpares separados.
function mdLoadRom(bytes) {
  const isSmd = bytes.length >= 512 && ((bytes.length - 512) % 16384) === 0 && bytes[8] === 0xAA && bytes[9] === 0xBB;
  if (!isSmd) return bytes;
  const blocks = (bytes.length - 512) / 16384;
  const out = new Uint8Array(blocks * 16384);
  for (let b = 0; b < blocks; b++) {
    const base = 512 + b * 16384;
    for (let i = 0; i < 8192; i++) {
      out[b * 16384 + 2 * i] = bytes[base + 8192 + i];
      out[b * 16384 + 2 * i + 1] = bytes[base + i];
    }
  }
  return out;
}

<script>
// ============ VDP do Master System e Game Gear (modo 4) ============
// Fundo de 32x28 tiles com rolagem, sprites 8x8 ou 8x16 (até 8 por linha), 16 cores de fundo e 16 de sprite.
// Game Gear: paleta de 12 bits; a janela de 160x144 fica no centro da tela de 256x192.
// Limitação: só o modo 4 (o usado pela maioria dos jogos); os outros modos ficam com a cor de fundo.
class SMSVDP {
  constructor(gg) {
    this.gg = gg;
    this.vram = new Uint8Array(0x4000);
    this.cram = new Uint8Array(64);
    this.rgb = new Uint8ClampedArray(32 * 4);   // cor pronta (RGBA) para cada índice de cor
    this.reg = new Uint8Array(16);
    this.addr = 0;
    this.code = 0;          // 0 leitura, 1 escrita VRAM, 2 registrador, 3 CRAM
    this.latch = 0;
    this.pending = false;   // esperando o segundo byte do comando
    this.readBuf = 0;
    this.vblankFlag = false;
    this.lineFlag = false;
    this.overflow = false;
    this.collision = false;
    this.lc = 0;            // contador de linha (interrupção de linha)
    this.line = 0;
    this.framebuffer = new Uint8ClampedArray(256 * 192 * 4);
    this.bgCol = new Uint8Array(256);   // cor do fundo por pixel (0 = transparente)
    this.bgPri = new Uint8Array(256);
    this.spCol = new Uint8Array(256);   // cor do sprite por pixel (0 = nenhum)
    for (let i = 0; i < 32; i++) this.updateColor(i);
  }

  updateColor(i) {
    let r, g, b;
    if (this.gg) {
      const lo = this.cram[i * 2], hi = this.cram[i * 2 + 1];
      r = (lo & 15) * 17; g = (lo >> 4) * 17; b = (hi & 15) * 17;
    } else {
      const v = this.cram[i];
      r = (v & 3) * 85; g = ((v >> 2) & 3) * 85; b = ((v >> 4) & 3) * 85;
    }
    const o = i * 4;
    this.rgb[o] = r; this.rgb[o + 1] = g; this.rgb[o + 2] = b; this.rgb[o + 3] = 255;
  }

  // Portas $BF (controle) e $BE (dados)
  writeControl(v) {
    v &= 0xFF;
    if (!this.pending) { this.latch = v; this.pending = true; return; }
    this.pending = false;
    this.code = v >> 6;
    if (this.code === 2) { this.reg[v & 0x0F] = this.latch; return; }
    this.addr = this.latch | ((v & 0x3F) << 8);
    if (this.code === 0) {
      this.readBuf = this.vram[this.addr];
      this.addr = (this.addr + 1) & 0x3FFF;
    }
  }

  readControl() {
    this.pending = false;
    const s = (this.vblankFlag ? 0x80 : 0) | (this.overflow ? 0x40 : 0) | (this.collision ? 0x20 : 0);
    this.vblankFlag = false; this.lineFlag = false; this.overflow = false; this.collision = false;
    return s;
  }

  writeData(v) {
    v &= 0xFF;
    this.pending = false;
    if (this.code === 3) {
      const idx = this.addr & (this.gg ? 0x3F : 0x1F);
      this.cram[idx] = v;
      this.updateColor(this.gg ? idx >> 1 : idx);
    } else this.vram[this.addr] = v;
    this.readBuf = v;
    this.addr = (this.addr + 1) & 0x3FFF;
  }

  readData() {
    this.pending = false;
    const v = this.readBuf;
    this.readBuf = this.vram[this.addr];
    this.addr = (this.addr + 1) & 0x3FFF;
    return v;
  }

  // Porta $7E: linha atual, com o salto que o hardware faz de 218 para 213
  vcount() { return this.line > 218 ? this.line - 6 : this.line; }

  irq() {
    return (this.vblankFlag && (this.reg[1] & 0x20) !== 0) || (this.lineFlag && (this.reg[0] & 0x10) !== 0);
  }

  fillLine(y, c) {
    const o = y * 256 * 4;
    for (let x = 0; x < 256; x++) {
      const p = o + x * 4, q = c * 4;
      this.framebuffer[p] = this.rgb[q]; this.framebuffer[p + 1] = this.rgb[q + 1];
      this.framebuffer[p + 2] = this.rgb[q + 2]; this.framebuffer[p + 3] = 255;
    }
  }

  // Cor (0..15) de um pixel de um tile de 4 bits por pixel
  tilePixel(tile, row, bit) {
    const vr = this.vram, t = tile * 32 + row * 4;
    return ((vr[t] >> bit) & 1) | (((vr[t + 1] >> bit) & 1) << 1) |
      (((vr[t + 2] >> bit) & 1) << 2) | (((vr[t + 3] >> bit) & 1) << 3);
  }

  renderLine(y) {
    const r = this.reg, vr = this.vram;
    const back = 16 + (r[7] & 15);
    if (!(r[1] & 0x40)) { this.fillLine(y, back); return; }   // tela desligada

    // ---- fundo
    const ntBase = (r[2] & 0x0E) << 10;
    const lockTop = (r[0] & 0x40) !== 0 && y < 16;
    const scrollX = lockTop ? 0 : r[8];
    const scrollY = r[9];
    for (let x = 0; x < 256; x++) {
      const sx = (x + 256 - scrollX) & 0xFF;
      const vsy = (r[0] & 0x80) && x >= 192 ? 0 : scrollY;
      const by = (y + vsy) % 224;
      const e = ntBase + ((((by >> 3) * 32) + (sx >> 3)) << 1);
      const entry = vr[e] | (vr[e + 1] << 8);
      const py = (entry & 0x400) ? 7 - (by & 7) : (by & 7);
      const px = sx & 7;
      const bit = (entry & 0x200) ? px : 7 - px;
      const ci = this.tilePixel(entry & 0x1FF, py, bit);
      this.bgCol[x] = ci ? ci + ((entry & 0x800) ? 16 : 0) : 0;
      this.bgPri[x] = (entry & 0x1000) ? 1 : 0;
    }

    // ---- sprites
    this.spCol.fill(0);
    const satBase = (r[5] & 0x7E) << 7;
    const sprBase = (r[6] & 4) ? 256 : 0;
    const h = (r[1] & 2) ? 16 : 8;
    const shift = (r[0] & 8) ? 8 : 0;
    let count = 0;
    for (let i = 0; i < 64; i++) {
      const sy = vr[satBase + i];
      if (sy === 0xD0) break;
      const dy = (y - ((sy + 1) & 0xFF)) & 0xFF;
      if (dy >= h) continue;
      if (++count > 8) { this.overflow = true; break; }
      const sx = vr[satBase + 128 + i * 2] - shift;
      let tile = (vr[satBase + 129 + i * 2] & (h === 16 ? 0xFE : 0xFF)) | sprBase;
      let row = dy;
      if (h === 16) { tile |= row >> 3; row &= 7; }
      for (let px = 0; px < 8; px++) {
        const X = sx + px;
        if (X < 0 || X > 255) continue;
        const ci = this.tilePixel(tile, row, 7 - px);
        if (!ci) continue;
        if (this.spCol[X]) { this.collision = true; continue; }
        this.spCol[X] = 16 + ci;
      }
    }

    // ---- composição
    const o = y * 256 * 4;
    for (let x = 0; x < 256; x++) {
      const s = this.spCol[x], b = this.bgCol[x];
      let c;
      if (s && (!b || !this.bgPri[x])) c = s;
      else if (b) c = b;
      else c = back;
      if ((r[0] & 0x20) && x < 8) c = back;   // esconde a primeira coluna
      const p = o + x * 4, q = c * 4;
      this.framebuffer[p] = this.rgb[q]; this.framebuffer[p + 1] = this.rgb[q + 1];
      this.framebuffer[p + 2] = this.rgb[q + 2]; this.framebuffer[p + 3] = 255;
    }
  }
}

<script>
// ============ Console Game Gear (e Master System, .sms) ============
// Mapa de memória do Z80:
//   $0000-$BFFF  ROM em 3 bancos de 16 KB (escolhidos em $FFFD, $FFFE e $FFFF)
//   $C000-$FFFF  RAM de 8 KB (espelhada); $FFFC-$FFFF também são registradores de banco
// Portas: $7E/$7F (contador de linha e PSG), $BE/$BF (VDP), $00 (Start no Game Gear),
//         $DC/$C0 (controle 1), $3E/$3F (controle de memória, ignorado).
// Sem RAM de cartucho e sem a BIOS do console (os jogos rodam direto da ROM).
const GG_BTN = { up: 1, down: 2, left: 4, right: 8, b1: 16, b2: 32, start: 128 };
const GG_LINES = 262;          // linhas por quadro (NTSC)
const GG_ACTIVE = 192;         // linhas visíveis no VDP
const GG_CYCLES_LINE = 228;    // ciclos do Z80 por linha
const GG_CLOCK = 3579545;      // relógio do Z80 e do PSG

class SMSMachine {
  constructor(rom, gg) {
    this.gg = gg;
    this.rom = rom;
    this.ram = new Uint8Array(0x2000);
    this.bank = [0, 1, 2];
    this.vdp = new SMSVDP(gg);
    this.psg = new PSG();
    this.pad = 0;
    this.z80 = new Z80({
      read: a => this.readMem(a),
      write: (a, v) => this.writeMem(a, v),
      in: p => this.portIn(p),
      out: (p, v) => this.portOut(p, v),
    });
    this.psgAcc = 0;
    this.sampAcc = 0;
    this.outRate = 44100;
    this.ring = new Float32Array(1 << 16);
    this.wr = 0;
    this.rd = 0;
  }

  // ---------- Memória ----------
  readMem(a) {
    a &= 0xFFFF;
    if (a < 0xC000) {
      const addr = this.bank[a >> 14] * 0x4000 + (a & 0x3FFF);
      return this.rom[addr % this.rom.length];
    }
    return this.ram[a & 0x1FFF];
  }
  writeMem(a, v) {
    a &= 0xFFFF;
    v &= 0xFF;
    if (a < 0xC000) return;                 // ROM não se escreve
    this.ram[a & 0x1FFF] = v;
    if (a === 0xFFFD) this.bank[0] = v;
    else if (a === 0xFFFE) this.bank[1] = v;
    else if (a === 0xFFFF) this.bank[2] = v;
  }

  // ---------- Portas ----------
  joy1() {
    let v = 0xFF;
    if (this.pad & GG_BTN.up) v &= ~1;
    if (this.pad & GG_BTN.down) v &= ~2;
    if (this.pad & GG_BTN.left) v &= ~4;
    if (this.pad & GG_BTN.right) v &= ~8;
    if (this.pad & GG_BTN.b1) v &= ~16;
    if (this.pad & GG_BTN.b2) v &= ~32;
    return v;
  }
  portIn(p) {
    p &= 0xFF;
    if (p === 0x7E) return this.vdp.vcount();
    if (p === 0x7F) return 0;
    if (p >= 0x80 && p <= 0xBF) return (p & 1) ? this.vdp.readControl() : this.vdp.readData();
    if (this.gg && p === 0x00) return (this.pad & GG_BTN.start) ? 0x7F : 0xFF;
    if (p === 0xDC || p === 0xC0) return this.joy1();
    return 0xFF;
  }
  portOut(p, v) {
    p &= 0xFF;
    if (p === 0x7E || p === 0x7F) { this.psg.write(v); return; }
    if (p >= 0x80 && p <= 0xBF) {
      if (p & 1) this.vdp.writeControl(v); else this.vdp.writeData(v);
    }
  }

  setButton(name, down) {
    const map = { up: GG_BTN.up, down: GG_BTN.down, left: GG_BTN.left, right: GG_BTN.right,
      a: GG_BTN.b1, b: GG_BTN.b2, start: GG_BTN.start };
    const bit = map[name];
    if (!bit) return;
    if (down) this.pad |= bit; else this.pad &= ~bit;
  }

  // ---------- Laço do quadro ----------
  runFrame() {
    const vdp = this.vdp, z = this.z80;
    vdp.lc = vdp.reg[10];
    for (let y = 0; y < GG_LINES; y++) {
      vdp.line = y;
      let spent = 0;
      while (spent < GG_CYCLES_LINE) spent += z.step();
      if (y < GG_ACTIVE) vdp.renderLine(y);
      if (y <= GG_ACTIVE) {
        if (vdp.lc === 0) { vdp.lc = vdp.reg[10]; vdp.lineFlag = true; } else vdp.lc--;
      }
      if (y === GG_ACTIVE) vdp.vblankFlag = true;
      z.intLine = vdp.irq();
      this.audio(spent);
    }
  }

  // ---------- Som (PSG) ----------
  setOutRate(r) { this.outRate = r; }
  audio(cycles) {
    this.psgAcc += cycles;
    while (this.psgAcc >= 16) { this.psgAcc -= 16; this.psg.tick(); }
    this.sampAcc += cycles * this.outRate / GG_CLOCK;
    while (this.sampAcc >= 1) { this.sampAcc -= 1; this.push(this.psg.level()); }
  }
  push(s) {
    if (s > 1) s = 1; else if (s < -1) s = -1;
    this.ring[this.wr & 0xFFFF] = s;
    this.wr++;
    if (this.wr - this.rd > 16384) this.rd = this.wr - 4096;
  }
  pull() {
    if (this.wr - this.rd < 1) return 0;
    const v = this.ring[Math.floor(this.rd) & 0xFFFF];
    this.rd += 1;
    return v;
  }
}

<script>
// ============ Console NES (liga CPU, PPU, cartucho, controles e laço de quadro) ============
// Mapa de memória da CPU:
//   $0000-$1FFF  RAM de 2 KB (espelhada)
//   $2000-$3FFF  registradores da PPU (espelhados a cada 8 bytes)
//   $4000-$401F  APU e controles (o som ainda não existe; os controles funcionam)
//   $4020-$5FFF  não usado
//   $6000-$7FFF  memória de bateria do cartucho (SRAM)
//   $8000-$FFFF  programa, controlado pela placa do cartucho

// Bits dos botões (ordem em que o jogo lê, bit 0 primeiro)
const NES_BUTTON = { a: 0x01, b: 0x02, select: 0x04, start: 0x08, up: 0x10, down: 0x20, left: 0x40, right: 0x80 };

class NES {
  constructor(bytes, sampleRate = 44100) {
    this.cart = new NesCart(bytes);
    this.ram = new Uint8Array(2048);
    this.ppu = new NesPPU(this.cart);
    this.apu = new NesAPU(sampleRate, a => this.read(a));
    this.cpu = new N2A03(this);
    this.ppu.onNmi = () => { this.cpu.nmiPending = true; };
    this.pad = [0, 0];        // botões pressionados de cada controle
    this.padShift = [0, 0];   // o que ainda falta ser lido de cada controle
    this.strobe = 0;
    this.dmaCycles = 0;       // ciclos gastos pelo DMA da OAM (a CPU fica parada)
  }

  read(a) {
    a &= 0xFFFF;
    if (a < 0x2000) return this.ram[a & 0x7FF];
    if (a < 0x4000) return this.ppu.readReg(a & 7);
    if (a === 0x4015) return this.apu.readStatus();
    if (a === 0x4016) return this.readPad(0);
    if (a === 0x4017) return this.readPad(1);
    if (a < 0x4020) return 0;
    return this.cart.cpuRead(a);
  }

  write(a, v) {
    a &= 0xFFFF;
    if (a < 0x2000) { this.ram[a & 0x7FF] = v; return; }
    if (a < 0x4000) { this.ppu.writeReg(a & 7, v); return; }
    if (a === 0x4014) { this.oamDma(v); return; }
    if (a === 0x4016) {
      this.strobe = v & 1;
      if (this.strobe) this.latchPads();
      return;
    }
    if (a < 0x4020) { this.apu.write(a, v); return; }
    this.cart.cpuWrite(a, v);
  }

  // Copia uma página de 256 bytes da CPU para a OAM da PPU
  oamDma(page) {
    const base = (page & 0xFF) << 8;
    const oam = this.ppu.oam;
    let o = this.ppu.oamAddr;
    for (let i = 0; i < 256; i++) { oam[o] = this.read(base + i); o = (o + 1) & 0xFF; }
    this.dmaCycles += 513;
  }

  latchPads() {
    this.padShift[0] = this.pad[0];
    this.padShift[1] = this.pad[1];
  }

  // Cada leitura devolve o próximo botão; depois dos 8 botões, o controle devolve 1s
  readPad(p) {
    if (this.strobe) return (this.pad[p] & 1) | 0x40;
    const bit = this.padShift[p] & 1;
    this.padShift[p] = (this.padShift[p] >> 1) | 0x80;
    return bit | 0x40;
  }

  setButton(p, name, down) {
    const bit = NES_BUTTON[name];
    if (!bit) return;
    if (down) this.pad[p] |= bit; else this.pad[p] &= ~bit;
  }

  // Roda a CPU, a APU e a PPU até terminar um quadro (240 linhas visíveis + VBlank)
  runFrame() {
    this.ppu.frameReady = false;
    while (!this.ppu.frameReady) {
      const cyc = this.cpu.step() + this.dmaCycles;
      this.dmaCycles = 0;
      this.apu.clock(cyc);
      this.ppu.tick(cyc * 3);
      this.cpu.irqLine = this.cart.mapper.irqPending() || this.apu.irqPending();
    }
  }
}
