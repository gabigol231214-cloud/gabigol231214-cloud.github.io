<script>
// ============ SISTEMAS ============
// Para colocar as logos depois: salve as imagens em  e troque o campo "logo".
const SYSTEMS = [
  { id: 'chip8',    name: 'CHIP-8',    ext: ['.ch8', '.c8'], logo: 'chip8.png',    ready: true,  desc: 'Computador de 1970, com jogos simples' },
  { id: 'atari2600', name: 'Atari 2600', ext: ['.a26', '.bin'], logo: 'atari2600.png', ready: true, desc: 'Cartuchos .a26 e .bin' },
  { id: 'gameboy', name: 'Game Boy / Color', ext: ['.gb', '.gbc'], logo: 'gameboy.png', ready: true, desc: 'Cartuchos .gb e .gbc (Game Boy e Game Boy Color, MBC1 e MBC3)' },
  { id: 'nes', name: 'NES', ext: ['.nes'], logo: 'nes.png', ready: true, desc: 'Cartuchos .nes (sem som por enquanto)' },
  { id: 'megadrive', name: 'Mega Drive', ext: ['.md', '.gen', '.smd', '.bin'], logo: 'megadrive.png', ready: true, desc: 'Cartuchos .md, .gen, .smd e .bin (sem som por enquanto)' },
  { id: 'gamegear', name: 'Game Gear', ext: ['.gg', '.sms'], logo: 'gamegear.png', ready: true, desc: 'Cartuchos .gg (Game Gear) e .sms (Master System)' }
];

// ============ ESTADO ============
let folderName = '';
let romFiles = [];              // [{ name, get() -> Promise<File> }]
let currentSystem = null;

// ============ TELAS ============
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function renderMenu() {
  const list = document.getElementById('systemList');
  list.innerHTML = '';
  SYSTEMS.forEach(sys => {
    const count = romsFor(sys).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('aria-disabled', String(!sys.ready));
    card.innerHTML = `
      <div class="logo"><img src="${sys.logo}" alt="" onerror="var p=this.parentNode;this.remove();p.insertAdjacentHTML('beforeend','<span>logo</span>')"></div>
      <div class="info">
        <b>${sys.name}</b>
        <small>${sys.ready ? (count ? count + ' jogo(s) encontrado(s)' : 'Nenhum jogo encontrado') : sys.desc}</small>
      </div>`;
    if (sys.ready) card.addEventListener('click', () => openSystem(sys));
    list.appendChild(card);
  });
  document.getElementById('folderInfo').textContent =
    folderName ? `${folderName} · ${romFiles.length} arquivo(s)` : 'Nenhuma pasta definida';
  document.getElementById('rescanBtn').disabled = !folderName;
}

function romsFor(sys) {
  return romFiles.filter(f => sys.ext.some(e => f.name.toLowerCase().endsWith(e)));
}

function openSystem(sys) {
  currentSystem = sys;
  document.getElementById('romListTitle').textContent = sys.name;
  const items = document.getElementById('romItems');
  const empty = document.getElementById('romEmpty');
  items.innerHTML = '';
  const roms = romsFor(sys);
  empty.textContent = roms.length ? '' :
    'Nenhum arquivo encontrado. Defina a pasta no menu ou adicione os arquivos.';
  roms.forEach(rom => {
    const b = document.createElement('button');
    b.className = 'rom';
    b.textContent = rom.name;
    b.addEventListener('click', () => openRom(sys, rom));
    items.appendChild(b);
  });

}

const folderInput = document.getElementById('folderInput');

  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: 'read' });
      folderName = dir.name;

      for await (const [name, handle] of dir.entries()) {

// ============ EMULADOR ============
const FONT = [
  0xF0,0x90,0x90,0x90,0xF0, 0x20,0x60,0x20,0x20,0x70,
  0xF0,0x10,0xF0,0x80,0xF0, 0xF0,0x10,0xF0,0x10,0xF0,
  0x90,0x90,0xF0,0x10,0x10, 0xF0,0x80,0xF0,0x10,0xF0,
  0xF0,0x80,0xF0,0x90,0xF0, 0xF0,0x10,0x20,0x40,0x40,
  0xF0,0x90,0xF0,0x90,0xF0, 0xF0,0x90,0xF0,0x10,0xF0,
  0xF0,0x90,0xF0,0x90,0x90, 0xE0,0x90,0xE0,0x90,0xE0,
  0xF0,0x80,0x80,0x80,0xF0, 0xE0,0x90,0x90,0x90,0xE0,
  0xF0,0x80,0xF0,0x80,0xF0, 0xF0,0x80,0xF0,0x80,0x80
];
const FONT_ADDR = 0x50, PROGRAM_ADDR = 0x200, MAX_ROM = 4096 - PROGRAM_ADDR;
const INSTR_PER_SEC = 700, TIMER_STEP = 1000 / 60;
const LAYOUT = [0x1,0x2,0x3,0xC, 0x4,0x5,0x6,0xD, 0x7,0x8,0x9,0xE, 0xA,0x0,0xB,0xF];
const KEYMAP = { '1':0x1,'2':0x2,'3':0x3,'4':0xC,'q':0x4,'w':0x5,'e':0x6,'r':0xD,'a':0x7,'s':0x8,'d':0x9,'f':0xE,'z':0xA,'x':0x0,'c':0xB,'v':0xF };

// Núcleo do CHIP-8 (o mesmo da versão anterior, separado do resto da interface)
class Chip8 {
  constructor() { this.reset(); }
  reset() {
    this.mem = new Uint8Array(4096);
    this.mem.set(FONT, FONT_ADDR);
    this.V = new Uint8Array(16);
    this.I = 0; this.pc = PROGRAM_ADDR; this.sp = 0;
    this.stack = new Uint16Array(16);
    this.dt = 0; this.st = 0;
    this.gfx = new Uint8Array(64 * 32);
    this.keys = new Uint8Array(16);
    this.error = null;
  }
  load(bytes) { this.reset(); this.mem.set(bytes.subarray(0, MAX_ROM), PROGRAM_ADDR); }
  tick() { if (this.dt > 0) this.dt--; if (this.st > 0) this.st--; }
  fail(op) {
    this.error = `Opcode desconhecido: 0x${op.toString(16).toUpperCase().padStart(4, '0')} em 0x${(this.pc - 2).toString(16).toUpperCase()}`;
  }
  cycle() {
    this.pc &= 0xFFF;
    const op = (this.mem[this.pc] << 8) | this.mem[(this.pc + 1) & 0xFFF];
    this.pc = (this.pc + 2) & 0xFFF;
    const x = (op >> 8) & 0xF, y = (op >> 4) & 0xF, n = op & 0xF;
    const nn = op & 0xFF, nnn = op & 0xFFF, V = this.V;

    switch (op & 0xF000) {
      case 0x0000:
        if (op === 0x00E0) this.gfx.fill(0);
        else if (op === 0x00EE) { if (this.sp === 0) return this.fail(op); this.sp--; this.pc = this.stack[this.sp]; }
        else this.fail(op);
        break;
      case 0x1000: this.pc = nnn; break;
      case 0x2000: if (this.sp >= 16) return this.fail(op); this.stack[this.sp++] = this.pc; this.pc = nnn; break;
      case 0x3000: if (V[x] === nn) this.pc += 2; break;
      case 0x4000: if (V[x] !== nn) this.pc += 2; break;
      case 0x5000: if (n === 0) { if (V[x] === V[y]) this.pc += 2; } else this.fail(op); break;
      case 0x6000: V[x] = nn; break;
      case 0x7000: V[x] = (V[x] + nn) & 0xFF; break;
      case 0x8000:
        switch (n) {
          case 0x0: V[x] = V[y]; break;
          case 0x1: V[x] |= V[y]; V[0xF] = 0; break;
          case 0x2: V[x] &= V[y]; V[0xF] = 0; break;
          case 0x3: V[x] ^= V[y]; V[0xF] = 0; break;
          case 0x4: { const s = V[x] + V[y]; V[x] = s & 0xFF; V[0xF] = s > 0xFF ? 1 : 0; break; }
          case 0x5: { const a = V[x], b = V[y]; V[x] = (a - b) & 0xFF; V[0xF] = a >= b ? 1 : 0; break; }
          case 0x6: { const bit = V[y] & 1; V[x] = V[y] >> 1; V[0xF] = bit; break; }
          case 0x7: { const a = V[x], b = V[y]; V[x] = (b - a) & 0xFF; V[0xF] = b >= a ? 1 : 0; break; }
          case 0xE: { const bit = (V[y] >> 7) & 1; V[x] = (V[y] << 1) & 0xFF; V[0xF] = bit; break; }
          default: this.fail(op);
        }
        break;
      case 0x9000: if (n === 0) { if (V[x] !== V[y]) this.pc += 2; } else this.fail(op); break;
      case 0xA000: this.I = nnn; break;
      case 0xB000: this.pc = (nnn + V[0]) & 0xFFF; break;
      case 0xC000: V[x] = Math.floor(Math.random() * 256) & nn; break;
      case 0xD000: {
        const vx = V[x] % 64, vy = V[y] % 32;
        V[0xF] = 0;
        for (let r = 0; r < n; r++) {
          const row = this.mem[(this.I + r) & 0xFFF];
          const py = vy + r;
          if (py >= 32) break;
          for (let c = 0; c < 8; c++) {
            if (!(row & (0x80 >> c))) continue;
            const px = vx + c;
            if (px >= 64) break;
            const idx = py * 64 + px;
            if (this.gfx[idx]) V[0xF] = 1;
            this.gfx[idx] ^= 1;
          }
        }
        break;
      }
      case 0xE000:
        if (nn === 0x9E) { if (this.keys[V[x] & 0xF]) this.pc += 2; }
        else if (nn === 0xA1) { if (!this.keys[V[x] & 0xF]) this.pc += 2; }
        else this.fail(op);
        break;
      case 0xF000:
        switch (nn) {
          case 0x07: V[x] = this.dt; break;
          case 0x0A: {
            let found = -1;
            for (let k = 0; k < 16; k++) if (this.keys[k]) { found = k; break; }
            if (found < 0) this.pc = (this.pc - 2) & 0xFFF; else V[x] = found;
            break;
          }
          case 0x15: this.dt = V[x]; break;
          case 0x18: this.st = V[x]; break;
          case 0x1E: this.I = (this.I + V[x]) & 0xFFF; break;
          case 0x29: this.I = FONT_ADDR + (V[x] & 0xF) * 5; break;
          case 0x33:
            this.mem[this.I] = Math.floor(V[x] / 100);
            this.mem[(this.I + 1) & 0xFFF] = Math.floor(V[x] / 10) % 10;
            this.mem[(this.I + 2) & 0xFFF] = V[x] % 10;
            break;
          case 0x55: for (let i = 0; i <= x; i++) this.mem[(this.I + i) & 0xFFF] = V[i]; this.I = (this.I + x + 1) & 0xFFF; break;
          case 0x65: for (let i = 0; i <= x; i++) V[i] = this.mem[(this.I + i) & 0xFFF]; this.I = (this.I + x + 1) & 0xFFF; break;
          default: this.fail(op);
        }
        break;
      default: this.fail(op);
    }
  }
}

function makeAtari(bytes) {
  const tia = new TIA();
  const bus = new AtariBus(new Cart(bytes), tia);
  return { tia, bus, riot: bus.riot, cpu: new M6507(bus) };
}

function setAtari(name, down) {
  atariInput[name] = down;
  if (atari) atari.tia.fire = atariInput.fire;
}

function atariFrame() {
  const a = atari;
  let s = 0xFF;                       // 0 = pressionado
  if (atariInput.up) s &= ~0x10;
  if (atariInput.down) s &= ~0x20;
  if (atariInput.left) s &= ~0x40;
  if (atariInput.right) s &= ~0x80;
  a.riot.swcha = s;
  a.tia.fire = atariInput.fire;
  // O TIA anda 3 ciclos de cor por ciclo do 6507. Escritas no meio da instrução
  // avançam o TIA até o ciclo exato da escrita (syncCb), e o resto vem depois.
  let done = 0;
  a.cpu.syncCb = c => { if (c > done) { a.tia.advance((c - done) * 3); done = c; } };
  while (!a.tia.frameDone) {
    done = 0;
    const cyc = a.cpu.step();
    a.riot.advance(cyc + a.tia.wsyncCycles);   // WSYNC: a CPU espera até a linha acabar
    a.tia.wsyncCycles = 0;
    if (cyc > done) a.tia.advance((cyc - done) * 3);
  }
  a.tia.frameDone = false;
}

// Cria os botões de um grupo (pad normal, lado esquerdo ou lado direito)
function buildCells(container, names, labels, press, template) {
  container.style.gridTemplateColumns = template;
  names.forEach(name => {
    const el = document.createElement('div');
    if (!name) { container.appendChild(el); return; }
    el.className = 'key';
    el.textContent = labels[name];
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); ensureAudio();
      el.setPointerCapture(e.pointerId);
      press(name, true);
      el.classList.add('on');
    });
    const up = () => { press(name, false); el.classList.remove('on'); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
    container.appendChild(el);
  });
}

// Monta os controles. Game Boy e Atari têm lados para o modo deitado; CHIP-8 usa só o pad hexadecimal.
function setupPad(mode) {
  pad.innerHTML = ''; padL.innerHTML = ''; padR.innerHTML = '';
  document.getElementById('emu').classList.toggle('split', mode !== 'chip8');
  if (mode === 'md') {
    buildCells(pad, MD_CELLS, MD_LABELS, setMd, 'repeat(4,1fr)');
    buildCells(padL, DPAD_CELLS, GB_LABELS, setMd, 'repeat(3,auto)');
    buildCells(padR, ['b', 'a', 'c', 'start'], MD_LABELS, setMd, 'repeat(2,auto)');
    return;
  }
  if (mode === 'sms') {
    buildCells(pad, SMS_CELLS, GB_LABELS, setSms, 'repeat(4,1fr)');
    buildCells(padL, DPAD_CELLS, GB_LABELS, setSms, 'repeat(3,auto)');
    buildCells(padR, ['b', 'a', null, 'start'], GB_LABELS, setSms, 'repeat(2,auto)');
    return;
  }
  if (mode === 'gb' || mode === 'nes') {
    const press = mode === 'nes' ? setNes : setGb;
    buildCells(pad, GB_CELLS, GB_LABELS, press, 'repeat(4,1fr)');
    buildCells(padL, DPAD_CELLS, GB_LABELS, press, 'repeat(3,auto)');
    buildCells(padR, ['b', 'a', 'select', 'start'], GB_LABELS, press, 'repeat(2,auto)');
    return;
  }
  if (mode === 'atari') {
    buildCells(pad, ATARI_CELLS, ATARI_LABELS, setAtari, 'repeat(3,1fr)');
    buildCells(padL, DPAD_CELLS, ATARI_LABELS, setAtari, 'repeat(3,auto)');
    buildCells(padR, ['fire'], ATARI_LABELS, setAtari, 'repeat(1,auto)');
    return;
  }
  pad.style.gridTemplateColumns = 'repeat(4,1fr)';
  LAYOUT.forEach(k => pad.appendChild(keyEls[k]));
}

// Som do Atari: 2 canais de onda quadrada (ruído ainda não implementado)
let atariAudio = null;
function ensureAtariAudio() {
  ensureAudio();
  if (atariAudio) return;
  atariAudio = [0, 1].map(() => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    g.gain.value = 0;
    o.connect(g).connect(audioCtx.destination);
    o.start();
    return { o, g };
  });
}
function updateAtariSound(tia) {
  if (!atariAudio) return;
  for (let c = 0; c < 2; c++) {
    const { o, g } = atariAudio[c];
    const audc = tia ? (c ? tia.audc1 : tia.audc0) : 0;
    const audf = tia ? (c ? tia.audf1 : tia.audf0) : 0;
    const audv = tia ? (c ? tia.audv1 : tia.audv0) : 0;
    const on = audc !== 0 && audv > 0;
    o.frequency.setTargetAtTime(31400 / (2 * (audf + 1)), audioCtx.currentTime, 0.01);
    g.gain.setTargetAtTime(on ? (audv / 15) * 0.08 : 0, audioCtx.currentTime, 0.01);
  }
}


// Som
let audioCtx = null, gainNode = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = 440;
    gainNode.gain.value = 0;
    osc.connect(gainNode).connect(audioCtx.destination);
    osc.start();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function setBeep(on) { if (gainNode) gainNode.gain.value = on ? 0.05 : 0; }

// Teclado virtual

LAYOUT.forEach(k => {
  const el = document.createElement('div');

  el.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); el.setPointerCapture(e.pointerId); setKey(k, true); });
  const release = () => setKey(k, false);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
  pad.appendChild(el);
  keyEls[k] = el;
});
function setKey(k, down) {
  emu.keys[k] = down ? 1 : 0;
  if (keyEls[k]) keyEls[k].classList.toggle('on', down);
}
window.addEventListener('keydown', e => {

    return;
  }
  if (nesEngine) {
    const n = GB_KEYS[e.key] || GB_KEYS[e.key.toLowerCase()];
    if (n) { e.preventDefault(); ensureAudio(); setNes(n, true); }
    return;
  }
  if (gbEngine) {
    const n = GB_KEYS[e.key] || GB_KEYS[e.key.toLowerCase()];
    if (n) { e.preventDefault(); ensureAudio(); setGb(n, true); }
    return;
  }
  if (atari) {
    const n = ATARI_KEYS[e.key] || ATARI_KEYS[e.key.toLowerCase()];
    if (n) { e.preventDefault(); ensureAudio(); setAtari(n, true); }
    return;
  }
  const k = KEYMAP[e.key.toLowerCase()];
  if (k === undefined) return;
  e.preventDefault(); ensureAudio(); setKey(k, true);
});
window.addEventListener('keyup', e => {
  if (!emuRunning) return;
  if (smsEngine) {
    const n = GB_KEYS[e.key] || GB_KEYS[e.key.toLowerCase()];
    if (n) setSms(n, false);
    return;
  }
  if (mdEngine) {
    const n = MD_KEYS[e.key] || MD_KEYS[e.key.toLowerCase()];
    if (n) setMd(n, false);
    return;
  }
  if (nesEngine) {
    const n = GB_KEYS[e.key] || GB_KEYS[e.key.toLowerCase()];
    if (n) setNes(n, false);
    return;
  }
  if (gbEngine) {
    const n = GB_KEYS[e.key] || GB_KEYS[e.key.toLowerCase()];
    if (n) setGb(n, false);
    return;
  }
  if (atari) {
    const n = ATARI_KEYS[e.key] || ATARI_KEYS[e.key.toLowerCase()];
    if (n) setAtari(n, false);
    return;
  }
  const k = KEYMAP[e.key.toLowerCase()];
  if (k !== undefined) setKey(k, false);
});

async function openRom(sys, rom) {
  const file = await rom.get();
  const bytes = new Uint8Array(await file.arrayBuffer());
  const maxSize = sys.id === 'atari2600' ? 32768 : sys.id === 'gameboy' ? 8388608 : sys.id === 'nes' ? 1048576 : sys.id === 'megadrive' ? 8388608 : sys.id === 'gamegear' ? 1048576 : MAX_ROM;
  if (bytes.length > maxSize) { alert(`Arquivo grande demais (máximo ${maxSize} bytes)`); return; }
  if (sys.id === 'nes') {
    try { new NesCart(bytes); } catch (e) { alert(e.message); return; }
  }
  if (sys.id === 'megadrive') {
    const hdr = mdLoadRom(bytes).slice(0x100, 0x104);
    if (String.fromCharCode(...hdr) !== 'SEGA') { alert('Esse arquivo não parece ser um jogo de Mega Drive (cabeçalho SEGA não encontrado)'); return; }
  }
  if (sys.id === 'gamegear' && bytes.length >= 0x8000 && String.fromCharCode(...bytes.slice(0x7FF0, 0x7FF8)).indexOf('SEGA') < 0) {
    alert('Esse arquivo não parece ser um jogo de Game Gear ou Master System (cabeçalho SEGA não encontrado)'); return;
  }
  pendingRam = sys.id === 'gameboy' ? await loadGbSave(gbSaveKey(rom.name, bytes.length))
    : sys.id === 'nes' ? await loadGbSave(nesSaveKeyOf(rom.name, bytes.length)) : null;
  currentRom = { sys, bytes, name: rom.name };
  startEmu();
}

function startEmu() {
  ensureAudio();
  const isAtari = currentRom.sys.id === 'atari2600';
  const isGb = currentRom.sys.id === 'gameboy';
  atari = isAtari ? makeAtari(currentRom.bytes) : null;
  gbEngine = isGb ? new GameBoy(currentRom.bytes, audioCtx.sampleRate) : null;
  const isNes = currentRom.sys.id === 'nes';
  const isMd = currentRom.sys.id === 'megadrive';
  mdEngine = isMd ? new MegaDrive(mdLoadRom(currentRom.bytes)) : null;
  mdAcc = 0;
  const isSms = currentRom.sys.id === 'gamegear';
  smsEngine = isSms ? new SMSMachine(currentRom.bytes, currentRom.name.toLowerCase().endsWith('.gg')) : null;
  smsAcc = 0;
  nesEngine = isNes ? new NES(currentRom.bytes, audioCtx.sampleRate) : null;
  if (isNes) {
    ensureGbAudio();
    nesAcc = 0;
    nesEngine.saveKey = nesSaveKeyOf(currentRom.name, currentRom.bytes.length);
    if (pendingRam) nesEngine.cart.sram.set(pendingRam.subarray(0, nesEngine.cart.sram.length));
    pendingRam = null;
    lastNesSum = null;
  }
  if (isGb) {
    ensureGbAudio();
    gbEngine.saveKey = gbSaveKey(currentRom.name, currentRom.bytes.length);
    if (pendingRam) gbEngine.bus.ram.set(pendingRam.subarray(0, gbEngine.bus.ram.length));
    pendingRam = null;
    lastRamSum = null;
  }
  if (isMd) {
    ensureGbAudio();
    mdEngine.sound.setOutRate(audioCtx.sampleRate);
  }
  if (isSms) {
    ensureGbAudio();
    smsEngine.setOutRate(audioCtx.sampleRate);
  }
  if (isAtari) ensureAtariAudio();
  const [cw, chh] = isGb ? [160, 144] : isAtari ? [160, 192] : isNes ? [256, 240] : isMd ? [320, 224] : isSms ? (smsEngine.gg ? [160, 144] : [256, 192]) : [64, 32];
  canvas.width = cw;
  canvas.height = chh;
  const wrap = document.getElementById('screenWrap');
  wrap.style.aspectRatio = isGb ? '160/144' : isAtari ? '160/192' : isNes ? '256/240' : isMd ? '320/224' : isSms ? (smsEngine.gg ? '160/144' : '256/192') : '2/1';
  wrap.style.width = (isGb || isAtari || isNes || isMd || isSms) ? 'min(60vw,300px)' : '';
  setupPad(isGb ? 'gb' : isNes ? 'nes' : isMd ? 'md' : isSms ? 'sms' : isAtari ? 'atari' : 'chip8');
  if (!isAtari && !isGb && !isNes && !isMd) emu.load(currentRom.bytes);
  paused = false;
  pauseBtn.textContent = 'Pausar';
  emuStatus.textContent = `${currentRom.sys.name}: ${currentRom.name}`;
  if (gbEngine && gbEngine.bus.unsupported) {
    emuStatus.textContent = `Tipo de cartucho não suportado (0x${gbEngine.bus.rom[0x147].toString(16).toUpperCase().padStart(2, '0')}): ${currentRom.name}`;
  }
  showScreen('emu');
  if (!emuRunning) {
    emuRunning = true;
    lastTime = performance.now();
    rafId = requestAnimationFrame(frame);
  }
}

function stopEmu() {
  emuRunning = false;
  updateAtariSound(null);
  if (nesEngine) { nesEngine.pad[0] = 0; nesEngine.pad[1] = 0; }
  if (mdEngine) { mdEngine.pad[0] = 0; mdEngine.pad[1] = 0; }
  if (smsEngine) smsEngine.pad = 0;
  cancelAnimationFrame(rafId);
  setBeep(false);
  for (let k = 0; k < 16; k++) setKey(k, false);
}

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Continuar' : 'Pausar';
});
document.getElementById('resetBtn').addEventListener('click', () => {

    if (gbEngine) pendingRam = gbEngine.bus.ram.slice();
    if (nesEngine) pendingRam = nesEngine.cart.sram.slice();
    startEmu();

});
document.getElementById('emuBackBtn').addEventListener('click', () => {

});

function draw() {
  if (smsEngine) {
    smsCtx.putImageData(new ImageData(smsEngine.vdp.framebuffer, 256, 192), 0, 0);
    if (smsEngine.gg) ctx.drawImage(smsFull, 48, 24, 160, 144, 0, 0, 160, 144);
    else ctx.drawImage(smsFull, 0, 0);
    return;
  }
  if (mdEngine) {
    ctx.putImageData(new ImageData(mdEngine.vdp.framebuffer, 320, 224), 0, 0);
    return;
  }
  if (nesEngine) {
    ctx.putImageData(new ImageData(nesEngine.ppu.framebuffer, 256, 240), 0, 0);
    return;
  }
  if (gbEngine) {
    ctx.putImageData(new ImageData(gbEngine.ppu.framebuffer, 160, 144), 0, 0);
    return;
  }
  if (atari) {
    ctx.putImageData(new ImageData(atari.tia.framebuffer, 160, 192), 0, 0);
    return;
  }
  const data = imageData.data, gfx = emu.gfx;
  for (let i = 0; i < gfx.length; i++) {
    const on = gfx[i], p = i * 4;
    data[p] = on ? 230 : 0; data[p + 1] = on ? 240 : 0; data[p + 2] = on ? 235 : 0; data[p + 3] = 255;
  }
  ctx.putImageData(imageData, 0, 0);
}

function frame(now) {
  if (!emuRunning) return;
  if (mdEngine) {
    const d = Math.min(now - lastTime, 100);
    lastTime = now;
    if (!paused) {
      mdAcc += d * 60 / 1000;
      let n = 0;
      while (mdAcc >= 1 && n < 3) { mdEngine.runFrame(); mdAcc--; n++; }
      if (mdAcc >= 1) mdAcc = 0;
    }
    draw();
    rafId = requestAnimationFrame(frame);
    return;
  }
  if (smsEngine) {
    const d = Math.min(now - lastTime, 100);
    lastTime = now;
    if (!paused) {
      smsAcc += d * 60 / 1000;
      let n = 0;
      while (smsAcc >= 1 && n < 3) { smsEngine.runFrame(); smsAcc--; n++; }
      if (smsAcc >= 1) smsAcc = 0;
    }
    draw();
    rafId = requestAnimationFrame(frame);
    return;
  }
  if (nesEngine) {
    const d = Math.min(now - lastTime, 100);
    lastTime = now;
    if (!paused) {
      nesAcc += d * 60 / 1000;
      let n = 0;
      while (nesAcc >= 1 && n < 3) { nesEngine.runFrame(); nesAcc--; n++; }
      if (nesAcc >= 1) nesAcc = 0;
    }
    draw();
    rafId = requestAnimationFrame(frame);
    return;
  }
  if (gbEngine) {
    if (!paused) gbEngine.runFrame();
    draw();
    rafId = requestAnimationFrame(frame);
    return;
  }
  if (atari) {
    if (!paused) { atariFrame(); updateAtariSound(atari.tia); }
    else updateAtariSound(null);
    draw();
    rafId = requestAnimationFrame(frame);
    return;
  }
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  if (!paused && !emu.error) {
    cycleAcc += dt * INSTR_PER_SEC / 1000;
    while (cycleAcc >= 1 && !emu.error) { emu.cycle(); cycleAcc--; }
    timerAcc += dt;
    while (timerAcc >= TIMER_STEP) { emu.tick(); timerAcc -= TIMER_STEP; }
    setBeep(emu.st > 0);
    if (emu.error) { emuStatus.textContent = emu.error; setBeep(false); }
  }
  draw();
  rafId = requestAnimationFrame(frame);
}

// ============ BIBLIOTECA E PROGRESSO (guardados no navegador) ============
// A pasta escolhida é copiada para o navegador (só arquivos de console), para a lista continuar
// no celular. O progresso dos jogos de Game Boy com bateria é salvo a cada 5 segundos, se mudou.
const KNOWN_EXTS = SYSTEMS.flatMap(s => s.ext);
let dbPromise = null;
let pendingRam = null;     // memória do cartucho a restaurar no próximo jogo
let lastRamSum = null;

function idbOpen() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('multiretro', 2);
    r.onupgradeneeded = () => {
      ['roms', 'saves', 'meta', 'states'].forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbPromise = null; rej(r.error); };
  });
  return dbPromise;
}
const reqValue = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = tx => new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });

async function idbGet(store, key) {
  const db = await idbOpen();
  return reqValue(db.transaction(store).objectStore(store).get(key));
}
async function idbPut(store, key, val) {
  const db = await idbOpen();
  const tx = db.transaction(store, 'readwrite');
  tx.objectStore(store).put(val, key);
  return txDone(tx);
}

// Copia a lista de ROMs da pasta para o navegador
async function persistLibrary() {
  try {
    const files = [];
    for (const f of romFiles) {
      if (KNOWN_EXTS.some(e => f.name.toLowerCase().endsWith(e))) files.push({ name: f.name, file: await f.get() });
    }
    const db = await idbOpen();
    const tx = db.transaction(['roms', 'meta'], 'readwrite');
    const roms = tx.objectStore('roms');
    roms.clear();
    files.forEach(f => roms.put(f.file, f.name));
    tx.objectStore('meta').put(folderName, 'folder');
    await txDone(tx);
  } catch (e) { /* sem espaço ou sem IndexedDB: a pasta vale só nesta sessão */ }
}

async function restoreLibrary() {
  try {
    const db = await idbOpen();
    const tx = db.transaction(['roms', 'meta'], 'readonly');
    const names = await reqValue(tx.objectStore('roms').getAllKeys());
    const files = await reqValue(tx.objectStore('roms').getAll());
    const folder = await reqValue(tx.objectStore('meta').get('folder'));
    if (!names.length) return;
    folderName = folder || 'Arquivos salvos';
    romFiles = names.map((name, i) => ({ name, get: async () => files[i] }));
  } catch (e) { /* sem IndexedDB: começa sem pasta */ }
}

// Progresso (memória do cartucho) de jogos de Game Boy com bateria
function gbSaveKey(name, size) { return `${name}|${size}`; }
async function loadGbSave(key) {
  try { return (await idbGet('saves', key)) || null; } catch (e) { return null; }
}
function ramSum(ram) {
  let h = 0;
  for (let i = 0; i < ram.length; i++) h = (Math.imul(h, 31) + ram[i]) | 0;
  return h;
}
async function saveGbRam(force) {
  const eng = gbEngine;
  if (!eng || !eng.bus.battery || !eng.saveKey) return;
  const sum = ramSum(eng.bus.ram);
  if (!force && sum === lastRamSum) return;
  try {
    await idbPut('saves', eng.saveKey, eng.bus.ram.slice());
    lastRamSum = sum;
  } catch (e) { /* sem espaço: tenta de novo na próxima vez */ }
}
function nesSaveKeyOf(name, size) { return `nes|${name}|${size}`; }
let lastNesSum = null;
async function saveNesRam(force) {
  const eng = nesEngine;
  if (!eng || !eng.cart.battery || !eng.saveKey) return;
  const sum = ramSum(eng.cart.sram);
  if (!force && sum === lastNesSum) return;
  try {
    await idbPut('saves', eng.saveKey, eng.cart.sram.slice());
    lastNesSum = sum;
  } catch (e) { /* tenta de novo na próxima vez */ }
}
setInterval(() => saveGbRam(false), 5000);
setInterval(() => saveNesRam(false), 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveGbRam(true); saveNesRam(true); } });
window.addEventListener('pagehide', () => { saveGbRam(true); saveNesRam(true); });

// ============ SALVAR ESTADO (foto do emulador, para continuar de onde parou) ============
// Copia CPU, memória, vídeo e timers de qualquer console. A ROM não entra na foto (já está guardada).
const STATE_SKIP = new Set(['rom', 'bytes', 'prg']);   // prg do NES é grande e nunca muda
function isDomLike(x) {
  return !!x && typeof x === 'object' && /^(HTML|Audio|Window|Document|Canvas|Image)/.test((x.constructor && x.constructor.name) || '');
}
function snapChild(x, seen) {
  if (typeof x === 'function' || isDomLike(x)) return undefined;
  if (x && typeof x === 'object') {
    if (seen.has(x)) return undefined;     // objeto já copiado por outro caminho
    seen.add(x);
    return snapshotValue(x, seen);
  }
  return x;
}
function snapshotValue(v, seen) {
  if (ArrayBuffer.isView(v)) return v.slice();
  if (Array.isArray(v)) return v.map(x => snapChild(x, seen));
  const out = {};
  for (const k of Object.keys(v)) {
    if (STATE_SKIP.has(k)) continue;
    const c = snapChild(v[k], seen);
    if (c !== undefined) out[k] = c;
  }
  return out;
}
// Põe o estado salvo dentro do objeto que já existe (mantém as funções da classe)
function restoreValue(lv, sv) {
  if (ArrayBuffer.isView(sv)) {
    if (ArrayBuffer.isView(lv) && lv.length === sv.length) { lv.set(sv); return lv; }
    return sv.slice();
  }
  if (Array.isArray(sv)) {
    if (!Array.isArray(lv)) return sv.slice();
    lv.length = sv.length;
    for (let i = 0; i < sv.length; i++) lv[i] = restoreValue(lv[i], sv[i]);
    return lv;
  }
  if (sv && typeof sv === 'object') {
    if (!lv || typeof lv !== 'object') return sv;
    for (const k of Object.keys(sv)) lv[k] = restoreValue(lv[k], sv[k]);
    return lv;
  }
  return sv;
}
function stateKey() { return `${currentRom.sys.id}|${currentRom.name}|${currentRom.bytes.length}`; }
function runningEngine() {
  if (!currentRom) return null;
  const id = currentRom.sys.id;
  const obj = id === 'gameboy' ? gbEngine : id === 'atari2600' ? atari : id === 'nes' ? nesEngine : id === 'megadrive' ? mdEngine : id === 'gamegear' ? smsEngine : emu;
  return obj ? { id, obj } : null;
}
function flashStatus(msg) {
  const name = currentRom ? `${currentRom.sys.name}: ${currentRom.name}` : '';
  emuStatus.textContent = msg;
  setTimeout(() => { if (currentRom && emuStatus.textContent === msg) emuStatus.textContent = name; }, 1500);
}
async function saveState() {
  const cur = runningEngine();
  if (!cur) return;
  try {
    const data = snapshotValue(cur.obj, new WeakSet([cur.obj]));
    await idbPut('states', stateKey(), { sys: cur.id, data });
    flashStatus('Estado salvo');
  } catch (e) { flashStatus('Não consegui salvar o estado'); }
}
async function loadState() {
  const cur = runningEngine();
  if (!cur) return;
  let saved = null;
  try { saved = await idbGet('states', stateKey()); } catch (e) { saved = null; }
  if (!saved) { flashStatus('Nenhum estado salvo para este jogo'); return; }
  restoreValue(cur.obj, saved.data);
  lastRamSum = null;
  flashStatus('Estado carregado');
}
document.getElementById('saveStateBtn').addEventListener('click', saveState);
document.getElementById('loadStateBtn').addEventListener('click', loadState);

// ============ TELA INTEIRA (liga e desliga) ============
function setFs(on) {
  document.getElementById('emu').classList.toggle('fs', on);
  document.getElementById('fullBtn').textContent = on ? 'Tamanho normal' : 'Tela inteira';
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) { /* sem tela cheia do navegador: fica só o modo visual */ }
}
document.getElementById('fullBtn').addEventListener('click', () => {
  setFs(!document.getElementById('emu').classList.contains('fs'));
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.getElementById('emu').classList.contains('fs')) setFs(false);
});

// ============ INÍCIO ============
renderMenu();
restoreLibrary().then(renderMenu);
</script>
